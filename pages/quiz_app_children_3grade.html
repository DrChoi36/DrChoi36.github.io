<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유년반 교과 퀴즈 (8과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    body { 
      margin: 0; padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #f0fdf4; /* 8과 테마: 성전과 나무 느낌의 연초록 */
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; font-size: 24px; 
    }

    #quiz-container { width: 90%; max-width: 600px; text-align: center; padding-bottom: 60px; }

    .question-box, .input-box { 
      padding: 30px; border-radius: 15px; color: #fff; 
      background-color: #27AE60; /* 성전 재료인 나무를 상징하는 초록색 */
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      line-height: 1.5;
    }

    button { 
      margin: 10px; padding: 15px 30px; font-size: 22px; 
      border: none; border-radius: 12px; cursor: pointer; 
      background-color: #fff; color: #333; font-weight: bold;
      box-shadow: 0 3px 0 #ddd;
    }
    button:active { transform: translateY(3px); box-shadow: none; }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    input[type="text"] { 
      padding: 12px; font-size: 24px; border-radius: 10px; 
      border: 2px solid #27AE60; width: 70%; text-align: center; margin-bottom: 20px; 
    }

    #result { 
      font-size: 28px; margin-top: 30px; color: #333; 
      background: #fff; padding: 30px; border-radius: 20px; 
      border: 5px solid #27AE60;
    }
    #feedback { min-height: 40px; margin-top: 20px; font-size: 28px; font-weight: bold; }

    #footer {
      position: fixed; bottom: 10px; left: 0; width: 100%;
      text-align: center; font-size: 14px; color: #aaa; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>유년반 성경퀴즈 8과</h2>
      <p style="font-size: 20px;">아름다운 집 (솔로몬 성전)</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi | 유년반 교과 8과</div>

  <script>
    'use strict';

    const questions = [
      { 
        type: 'ox',   
        question: '솔로몬 왕이 성전을 지을 때, 공사장에서는 망치 소리나 시끄러운 연장 소리가 들리지 않았다.', 
        answer: 'O',
        comment: '산에서 돌을 완벽하게 깎아왔기 때문에 공사장에서는 조용히 조립만 했어요.'
      }, 
      { 
        type: 'fill', 
        question: '기억절: "만군의 여호와여 주의 (   )이 어찌 그리 사랑스러운지요" (시편 84:1)', 
        answer: '장막',
        comment: '하나님이 계시는 아름다운 장막을 사랑하는 마음을 담은 노래예요. '
      },
      { 
        type: 'mcq',  
        question: '솔로몬 왕은 성전을 짓기 위해 어느 나라의 히람 왕에게 백향목 나무를 보내달라고 부탁했나요?', 
        options: ['A. 애굽', 'B. 두로', 'C. 바벨론', 'D. 블레셋'], 
        answer: 'B. 두로',
        comment: '두로 왕 히람은 다윗 왕의 친구였고, 성전 건축을 위해 좋은 나무를 보내주었어요.'
      },
      { 
        type: 'mcq',  
        question: '성전 안의 벽과 천장, 바닥은 무엇으로 입혀서 눈부시게 아름다웠나요?', 
        options: ['A. 은', 'B. 동', 'C. 금', 'D. 보석'], 
        answer: 'C. 금',
        comment: '아름답게 조각한 나무 위에 금을 입혀서 아주 귀하고 아름답게 만들었어요.'
      },
      { 
        type: 'short',
        question: '솔로몬 성전을 짓는 데 도움을 주기 위해 히람 왕이 보내준 위대한 예술가의 이름은 무엇인가요? (4글자)', 
        answer: '후람아비', 
        comment: '후람-아비는 금, 은, 동, 나무 등을 아주 잘 다루는 뛰어난 예술가였어요. '
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    const themes = ['#27AE60', '#2980B9', '#8E44AD', '#F39C12', '#C0392B'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { alert("이름을 입력해주세요!"); return; }
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
      questionTextEl.textContent = q.question;
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O'); createBtn('X');
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '정답을 써보세요';
        answerAreaEl.appendChild(input);
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '확인';
        submitBtn.onclick = () => checkAnswer(input.value);
        answerAreaEl.appendChild(submitBtn);
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text) {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if(answerAreaEl.querySelector('.next-btn')) return;
      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short') {
        isCorrect = normalize(userAns).includes(normalize(q.answer));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:#27AE60;'>우와! 정답입니다! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:#C0392B;'>아쉬워요! 정답은 [${q.answer}] 입니다. ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '18px';
      commentDiv.style.color = '#666';
      commentDiv.style.marginTop = '10px';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제로';
      nextBtn.style.backgroundColor = '#333';
      nextBtn.style.color = '#fff';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(document.createElement('br'));
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length ? "최고예요! 솔로몬처럼 지혜롭군요!" : "잘했어요! 성경 이야기를 아주 잘 이해했네요!";
      resultEl.innerHTML = `
        <h2>축하합니다, ${participantName} 어린이!</h2>
        <div style="font-size: 60px; margin: 20px 0;">⛪</div>
        <p>우리 어린이의 8과 점수</p>
        <p><span style="color:#27AE60; font-size:45px;">${score} / ${questions.length}</span></p>
        <p style="font-weight:bold;">${message}</p>
        <button onclick="location.reload()">다시 도전하기</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
