<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (11과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #f0f8ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #6B5B95; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #F7CAC9; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 11과</h2>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    // 화면이 완전히 로딩된 후 코드를 실행하도록 설정 (오류 방지)
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 11과 문제 데이터 (생각하지 못한 봉사)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '다락방에 모인 제자들은 서로 겸손하게 남의 발을 씻겨주겠다고 다투었다.', 
          answer: 'X' 
        }, 
        // [근거: source 939, 942] "열두 제자는 논쟁하기 시작했습니다... 서로 예수님 가까이에 앉으려고 경쟁했습니다... 서로 누가 종의 일을 할까 살피느라 바빴습니다."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "인자가 온 것은 섬김을 받으려 함이 아니라 도리어 (   )려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라" (마태복음 20:28)', 
          answer: '섬기' 
        },
        // [근거: source 919] "...도리어 섬기려 하고..."

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '유월절 만찬을 위해 다락방에 모인 열두 제자들은 서로 어떤 일로 속으로 다투었나요?', 
          options: ['A. 누가 가장 많이 봉사할 것인가?', 'B. 누가 예수님 나라에서 가장 높은 자리를 차지할 것인가?', 'C. 누가 가장 맛있는 음식을 만들 것인가?', 'D. 누가 로마 군인과 싸울 것인가?'], 
          answer: 'B. 누가 예수님 나라에서 가장 높은 자리를 차지할 것인가?' 
        },
        // [근거: source 939] "누가 예수님 가장 가까이에 있는 직책을 맡을까? 누가 가장 높은 자리에 임명될까?"

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님께서 제자들의 발을 씻기실 때, 처음에는 절대 안 된다고 거절하다가 나중에는 손과 머리까지 씻어달라고 한 제자는 누구인가요?', 
          options: ['A. 요한', 'B. 유다', 'C. 베드로', 'D. 야고보'], 
          answer: 'C. 베드로'
        },
        // [근거: source 979, 980] "...하고 베드로가 거부하자... 그러자 베드로는 '정말 그렇다면 발뿐만 아니라 손과 머리까지 씻어주세요.'라고 말했습니다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '유대인들의 전통에 따르면 떡을 먹기 전 (   )이/가 손님들의 발을 씻겨주는 풍습이 있었습니다. 아무도 이 일을 하려고 하지 않자 예수님께서 직접 하셨습니다. 빈칸에 들어갈 한 글자는 무엇일까요?', 
          answer: '종' 
        },
        // [근거: source 955] "유대인들은 떡을 먹기 전 종들이 손님들의 발을 씻겨주는 것이 전통이었습니다."

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '11과를 공부하며, 나도 예수님처럼 겸손하게 다른 사람을 위해 어떤 "생각하지 못한 봉사"를 실천할 수 있을지 나의 다짐을 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9']; // 문제 배경색

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면(다음 버튼이 있으면) 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 내용이 있으면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          isCorrect = normalize(userAns) === normalize(q.answer);
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "yellow"; // 배경이 어두울 수 있으므로 밝은 색
          score++;
        } else {
          feedbackEl.textContent = "틀렸습니다! ❌";
          feedbackEl.style.color = "#ffcccc";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>${participantName} 학생은<br>
          11과 총 ${questions.length}문제 중<br>
          <span style="color:red; font-size:40px;">${score}</span>개를 맞췄어요!</h3>
          <p>참 잘했어요! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
