<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (9과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #f0f8ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #6B5B95; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #F7CAC9; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 9과</h2>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    // 화면이 완전히 로딩된 후 코드를 실행하도록 설정 (오류 방지)
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 9과 문제 데이터 (지도자를 따라 감)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '예수님은 아름답고 행복한 하늘을 버리고, 죄로 인해 고통받는 우리를 구하기 위해 기꺼이 이 땅에 오시기로 선택하셨다.', 
          answer: 'O' 
        }, 
        // [근거: source 775, 777, 778] "예수님은 하늘의 모든 평안과 행복을 버리고... 즐거운 마음으로 고통의 시간을 선택하셨습니다."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "그가 찔림은 우리의 허물 때문이요... 그가 징계를 받으므로 우리는 (   )을/를 누리고 그가 채찍에 맞으므로 우리는 나음을 받았도다" (이사야 53:5)', 
          answer: '평화' 
        },
        // [근거: source 750] "...그가 징계를 받으므로 우리는 평화를 누리고..."

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님을 따르던 제자 중 한 명은 예수님을 얼마를 받고 팔아버렸나요?', 
          options: ['A. 금 10냥', 'B. 은 30냥', 'C. 동전 100개', 'D. 양 10마리'], 
          answer: 'B. 은 30냥' 
        },
        // [근거: source 783] "예수님을 따르던 제자 중 한 명은 예수님을 은 30냥을 받고 팔아버렸습니다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님께서 십자가와 가시면류관의 고통을 묵묵히 인내하며 견디신 가장 큰 이유는 무엇인가요?', 
          options: ['A. 로마의 왕이 되기 위해서', 'B. 천사들에게 칭찬을 받으려고', 'C. 우리를 향한 사랑 때문에', 'D. 기적을 보여주기 위해서'], 
          answer: 'C. 우리를 향한 사랑 때문에'
        },
        // [근거: source 806] "그 모든 것은 우리를 향한 예수님의 사랑의 마음이었습니다. 그분은 우리의 모든 죄 위해 돌아가셨습니다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '9과의 중심 생각에 따르면, 우리는 다른 사람에게 "이것"을 할 때 예수님의 모본을 따르는 것입니다. 무엇일까요? (힌트: 2글자)', 
          answer: '봉사' 
        },
        // [근거: source 748] "우리는 다른 사람에게 봉사할 때 예수님의 모본을 따릅니다."

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '9과를 공부하며, 우리를 위해 십자가를 지신 예수님의 사랑을 생각할 때 어떤 마음이 드는지 한 줄 이상 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9']; // 문제 배경색

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면(다음 버튼이 있으면) 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 내용이 있으면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          isCorrect = normalize(userAns) === normalize(q.answer);
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "yellow"; // 배경이 어두울 수 있으므로 밝은 색
          score++;
        } else {
          feedbackEl.textContent = "틀렸습니다! ❌";
          feedbackEl.style.color = "#ffcccc";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>${participantName} 학생은<br>
          9과 총 ${questions.length}문제 중<br>
          <span style="color:red; font-size:40px;">${score}</span>개를 맞췄어요!</h3>
          <p>참 잘했어요! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
