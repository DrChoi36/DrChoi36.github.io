<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (2과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #fdfcf0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 22px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 20px; 
      color: #fff; 
      background-color: #4A90E2; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 8px; 
      padding: 15px 25px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
      box-shadow: 0 4px 0 #ddd;
    }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:hover { background-color: #f9f9f9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 12px; 
      font-size: 22px; 
      border-radius: 10px; 
      border: 2px solid #ddd; 
      width: 80%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 28px; 
      margin-top: 30px; 
      color: #333; 
      background: #fff; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    #feedback { 
      min-height: 50px; 
      margin-top: 20px; 
      font-size: 26px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #aaa;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>📖 소년반 성경퀴즈 제2과</h2>
      <p style="font-size: 18px;">"동등한 가치가 있음"</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 홍길동" />
      <br>
      <button id="start-btn">퀴즈 시작하기 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; color: #777; margin-bottom: 10px; font-weight: bold;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 25px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      const questions = [
        { 
          type: 'ox',   
          question: '바울이 고린도에서 만난 브리스길라와 아굴라는 천막 제조공이었으며, 일곱째 날(안식일)에도 쉬지 않고 가게 문을 열어 열심히 일했다.', 
          answer: 'X' 
        }, 
        // [근거: PDF 2쪽] "그들은 성실하게 일합니다. 일곱째 날에는 문을 열지 않지만요."

        { 
          type: 'fill', 
          question: '기억절: "이제는 전에 멀리 있던 너희가 그리스도 예수 안에서 그리스도의 (    )로 가까워졌느니라" (에베소서 2:13)', 
          answer: '피' 
        },
        // [근거: PDF 2쪽 기억절] "그리스도의 피로 가까워졌느니라"

        { 
          type: 'mcq',  
          question: '브리스길라와 아굴라 부부는 클라우디우스 황제의 명령으로 인해 어디에서 쫓겨나 고린도로 오게 되었나요?', 
          options: ['A. 에베소', 'B. 아테네', 'C. 로마', 'D. 빌립보'], 
          answer: 'C. 로마' 
        },
        // [근거: PDF 4쪽] "우리는 클라디우스 황제가 모든 유대인들에게 추방 명령을 내렸을 때 로마에서 쫓겨 왔습니다."

        { 
          type: 'mcq',  
          question: '유대인들이 바울의 설교를 거절하고 대적하자, 바울은 앞으로 누구에게 복음을 전하겠다고 말했나요?', 
          options: ['A. 로마 병정들', 'B. 이방인들', 'C. 왕과 귀족들', 'D. 어린아이들'], 
          answer: 'B. 이방인들'
        },
        // [근거: PDF 5쪽] "이제부터는 이방인들에게 설교하겠소."

        { 
          type: 'short',
          question: '바울이 회당을 나가서 바로 옆에 사는 이 사람의 집으로 가서 복음을 전했습니다. 하나님을 경배했던 이 이방인의 이름은 무엇인가요?', 
          answer: '유스도' 
        },
        // [근거: PDF 6쪽] "바울은 회당을 나가서 바로 옆에 사는 유스도의 집으로 갔습니다."

        { 
          type: 'any',  
          question: '하나님은 유대인이나 이방인이나 모두 동등하게 사랑하십니다. 내가 우리 반이나 학교에서 소외된 친구에게 하나님의 사랑을 전할 수 있는 구체적인 방법 한 가지를 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#4A90E2', '#50C878', '#FFB347', '#9370DB', '#F08080', '#20B2AA'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 입력해야 시작할 수 있어요! 😊");
          return;
        }
        participantName = nameVal;
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.textContent = '';
        const q = questions[current];

        questionNumberEl.textContent = `Q${current + 1}.`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '자유롭게 적어주세요' : '정답을 입력하세요';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '확인';
          submitBtn.style.backgroundColor = '#333';
          submitBtn.style.color = '#fff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length >= 2; 
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          isCorrect = (normalize(userAns) === normalize(q.answer));
        }

        if (isCorrect) {
          feedbackEl.textContent = q.type === 'any' ? "멋진 생각이에요! 👍" : "정답입니다! 잘했어요! 🎉";
          feedbackEl.style.color = "#2E7D32";
          score++;
        } else {
          feedbackEl.textContent = `아쉬워요! 정답은 [ ${q.answer} ] 입니다. 📖`;
          feedbackEl.style.color = "#D32F2F";
        }

        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '최종 결과 확인' : '다음 문제로 ▶';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        nextBtn.style.width = '100%';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let message = score === questions.length ? "성경 박사님이시네요! 최고예요! 🏆" : "수고했어요! 성경 이야기를 다시 한번 읽어볼까요? 📖";
        
        resultEl.innerHTML = `
          <h2 style="margin-top:0;">축하합니다!</h2>
          <p><strong>${participantName}</strong> 어린이의 점수는...</p>
          <div style="font-size: 60px; font-weight: bold; color: #4A90E2; margin: 20px 0;">
            ${Math.round((score / questions.length) * 100)}점
          </div>
          <p style="font-size: 20px;">${questions.length}문제 중 ${score}문제를 해결했습니다.</p>
          <p style="color: #666; font-size: 18px;">${message}</p>
          <button onclick="location.reload()" style="background-color: #4A90E2; color: #fff; width: 100%; margin-top: 20px;">다시 도전하기</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }
    });
  </script>
</body>
</html>
