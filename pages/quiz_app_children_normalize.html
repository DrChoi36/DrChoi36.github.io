<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (10과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #f0f8ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #6B5B95; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #F7CAC9; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 10과</h2>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    // 화면이 완전히 로딩된 후 코드를 실행하도록 설정 (오류 방지)
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 10과 문제 데이터 (준비가 됨)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '예수님은 제자들에게 예루살렘 성안으로 들어가면 "큰 물동이"를 지고 가는 사람을 찾아 따라가라고 하셨다.', 
          answer: 'O' 
        }, 
        // "성안으로 들어가면 큰 물동이를 지고 가는 사람을 찾아보아라. 그리고 그 사람을 만나거든 그 집으로 따라가거라"

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "각각 (   )을/를 받은 대로 하나님의 여러 가지 은혜를 맡은 선한 청지기 같이 서로 봉사하라" (베드로전서 4:10)', 
          answer: '은사' 
        },
        // "각각 은사를 받은 대로..."

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '하나님께서 유대인들을 애굽에서 구원해내신 때를 기억하기 위해 지키는 명절로, 제자들이 예수님과 함께 먹기 위해 준비한 이 명절의 이름은 무엇인가요?', 
          options: ['A. 초막절', 'B. 유월절', 'C. 오순절', 'D. 나팔절'], 
          answer: 'B. 유월절' 
        },
        // "유월절은 하나님께서 유대인들을 애굽에서 구원해내신 때를 기억하기 위한 것이었습니다... 우리가 어디에 가서 당신을 위해 유월절을 준비하기 원하십니까?"

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님의 심부름으로 유월절 만찬을 준비하기 위해 마을로 들어간 두 제자는 누구인가요?', 
          options: ['A. 야고보와 안드레', 'B. 빌립과 나다나엘', 'C. 베드로와 요한', 'D. 마태와 도마'], 
          answer: 'C. 베드로와 요한'
        },
        // "베드로와 요한아, 오늘 마을로 들어가거라... 베드로와 요한은 서둘러서 예수님이 말씀하신 대로 마을에 들어갔습니다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '이번 10과의 중심 생각에서, 우리는 하나님께서 주신 "이것"을 사용하여 하나님께 최선의 봉사를 한다고 배웠습니다. 3글자인 "이것"은 무엇일까요?', 
          answer: '달란트' 
        },
        // "우리는 하나님께서 주신 달란트를 사용하여 하나님께 최선을 봉사를 합니다." (정답: 달란트, 혹은 기억절에 나온 은사도 정답 처리되도록 isSameAnswer에서 유연하게 대처 가능하지만 주 정답은 달란트)

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '10과를 공부하며, 하나님이 나에게 주신 달란트(재능)는 무엇이라고 생각하는지, 그리고 그것으로 어떻게 봉사하고 싶은지 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9']; // 문제 배경색

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면(다음 버튼이 있으면) 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 내용이 있으면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          // 단답형에서 '달란트' 외에 '은사'라고 대답해도 정답으로 인정
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          if (nAns === '달란트' && nUser === '은사') {
            isCorrect = true;
          } else {
            isCorrect = nUser === nAns;
          }
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "yellow"; // 배경이 어두울 수 있으므로 밝은 색
          score++;
        } else {
          feedbackEl.textContent = "틀렸습니다! ❌";
          feedbackEl.style.color = "#ffcccc";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>${participantName} 학생은<br>
          10과 총 ${questions.length}문제 중<br>
          <span style="color:red; font-size:40px;">${score}</span>개를 맞췄어요!</h3>
          <p>참 잘했어요! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
