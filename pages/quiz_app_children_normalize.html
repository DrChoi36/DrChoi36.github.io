<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (2과 - 처음엔 불, 다음엔 비)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #fff7ed; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #1e293b;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #c2410c; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #0f172a; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f8fafc; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #cbd5e1; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fecdd3;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #94a3b8; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🔥 소년반 성경퀴즈 2과 🌧️</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"처음엔 불, 다음엔 비"<br>이름을 입력하고 갈멜산의 승리 퀴즈를 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 엘리야" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #9a3412; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 2과: 처음엔 불, 다음엔 비 (열왕기상 18:1~40)
      const questions = [
        // 1번: OX 문제 (본문의 핵심 사건 확인)
        { 
          type: 'ox',   
          question: '엘리야는 하나님께 기도하기 전에 번제물과 제단 위에 물을 세 번에 걸쳐 흠뻑 부어 도랑까지 물이 가득 차게 만들었다.', 
          answer: 'O' 
        }, 
        // [근거: 본문 22쪽] "통 넷에 물을 채워다가 번제물과 나무 위에 부으라... 다시 그리하라... 세 번째로 그리하라... 도랑에 물이 가득찼습니다."

        // 2번: 기억절 문제 (열왕기상 18:37 빈칸 채우기)
        { 
          type: 'fill', 
          question: '기억절: "여호와여 내게 응답하옵소서 내게 응답하옵소서 이 백성에게 주 여호와는 하나님이신 것과 주는 그들의 마음을 (         )을 알게 하옵소서 하매" (열왕기상 18:37)', 
          answer: '되돌이키심' 
        },
        // [근거: 본문 19쪽 기억절] "주는 그들의 마음을 되돌이키심을 알게 하옵소서 하매(열왕기상 18:37)"

        // 3번: 4지 선다형 (본문 세부 내용 확인 - 대결 장소)
        { 
          type: 'mcq',  
          question: '엘리야와 바알의 선지자들이 모여 불로 응답하시는 참된 신이 누구인지 증명하는 대결을 펼쳤던 장소(산)는 어디인가요?', 
          options: [
            'A. 시내산', 
            'B. 갈멜산', 
            'C. 감람산', 
            'D. 헤르몬산'
          ], 
          answer: 'B. 갈멜산' 
        },
        // [근거: 본문 20쪽] "그는 아합에게 바알의 모든 제사장들과 사람들을 갈멜산으로 모이게 해달라고 요청했습니다."

        // 4번: 4지 선다형 (본문 세부 내용 확인 - 바알 선지자의 수)
        { 
          type: 'mcq',  
          question: '갈멜산에 당당하게 올라와 엘리야를 둘러싸고 위협하며 제단 주위에서 헛되이 춤추고 소리 질렀던 바알의 선지자는 총 몇 명이었나요?', 
          options: [
            'A. 50명', 
            'B. 100명', 
            'C. 450명', 
            'D. 850명'
          ], 
          answer: 'C. 450명' 
        },
        // [근거: 본문 20쪽] "바알의 450명의 선지자들이 당당하게 산으로 올라와서 엘리야를 둘러쌌습니다."

        // 5번: 단답형 (핵심 숫자/키워드)
        { 
          type: 'short',
          question: '엘리야가 무너진 여호와의 제단을 다시 수축할 때, 이스라엘의 지파 수를 상징하여 올려놓은 돌은 모두 몇 개인가요? (숫자 또는 한글로 입력)', 
          answer: '12' 
        },
        // [근거: 본문 21쪽] "엘리야는 여호와께 바치는 무너진 제단으로 갔습니다. 그는 12지파를 상징하는 각 돌을 제자리에 올려놓았습니다."

        // 6번: 느낀점 (자유 서술형)
        { 
          type: 'any',  
          question: '바알 제사장들의 시끄러운 외침과 달리, 엘리야의 짧고 단순하지만 진실했던 기도를 들으시고 불로 응답하신 하나님께 여러분은 어떤 믿음의 기도를 드리고 싶은지 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 하늘에서 내린 불과 생명의 비를 상징하는 오렌지 / 앰버 / 딥블루 / 인디고 테마
      const themes = ['#C2410C', '#B45309', '#D97706', '#0369A1', '#1D4ED8', '#4338CA'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 감사의 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#9a3412';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 12개, 열두개, 열둘 등 유연한 정답 인정
          if (nAns === '12' && (nUser === '12' || nUser === '12개' || nUser === '열두개' || nUser === '열둘' || nUser === '열두개의돌' || nUser === '12개의돌')) {
            isCorrect = true;
          } else if (nAns === '되돌이키심' && (nUser === '되돌이키심' || nUser === '되돌이키시는것' || nUser === '되돌이킴')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #15803d;'>우리의 기도를 들으시고 응답하시는 참 하나님께 멋진 다짐을 나누어주어 고마워요! 🔥🌧️✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #15803d;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #b91c1c;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 기존 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 진행 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#9a3412';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "갈멜산에서 불과 비로 응답하신 하나님처럼, 오직 살아계신 참 하나님만을 마음 다해 예배하고 따르는 멋진 믿음의 용사가 되길 응원해요! 🔥🌧️";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 엘리야처럼 참 하나님을 굳건히 의지하고 담대하게 믿음을 고백하는 소년반 최고 성경 박사님이에요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">2과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#c2410c; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#9a3412; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
