<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (10과 - 원수의 양자가 되다)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #f0f4f8; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #333;
    }

    /* 퀴즈 컨테이너 스타일 */
    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 30px 24px; 
      border-radius: 20px; 
      color: #fff; 
      background-color: #4A6572; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    /* 버튼 스타일 */
    button { 
      margin: 8px 6px; 
      padding: 14px 24px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #2c3e50; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f1f5f9; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #e2e8f0; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #2c3e50; 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 18px; 
      font-size: 24px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #ef4444;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* 하단 푸터 */
    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #94a3b8; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">📖 소년반 성경퀴즈 10과</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"원수의 양자가 되다"<br>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 다니엘" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #f8fafc; color: #1e293b; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 결과 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 10과: 원수의 양자가 되다 (여호수아 2장 / 이사야 41:9)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '여리고 성에 살던 라합은 이스라엘의 두 정탐꾼을 성난 군사들로부터 숨겨주기 위해 지붕 위 "아마 다발" 밑에 숨겼다.', 
          answer: 'O' 
        }, 
        // [근거: PDF 75쪽] "지금 지붕 위에 실을 짜려고 아마(식물의 일종) 다발을 널어서 말리는 중인데, 얼른 그 밑에 숨으세요."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "내가 땅 끝에서부터 너를 붙들며 땅 모퉁이에서부터 너를 부르고 네게 이르기를 너는 나의 (    )이라 내가 너를 택하고 싫어하여 버리지 아니하였다 하였노라" (이사야 41:9)', 
          answer: '종' 
        },
        // [근거: PDF 75쪽] "너는 나의 종이라 내가 너를 택하고..."

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '이스라엘 지도자 여호수아의 명령을 받고 여리고 성에 비밀 정보를 알아내기 위해 파견된 사람들은 몇 명이었나요?', 
          options: ['A. 2명', 'B. 4명', 'C. 7명', 'D. 12명'], 
          answer: 'A. 2명' 
        },
        // [근거: PDF 75쪽] "수염을 기른 두 남자가... 이 두 사람은 이스라엘의 지도자 여호수아가 보낸 비밀 정탐꾼들이었습니다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '여리고 성이 무너져 멸망할 때, 라합과 그 가족들이 구원받기 위해 창문에 매달아 두어야 했던 약속의 표시는 무엇이었나요?', 
          options: ['A. 은색 방울', 'B. 푸른 깃발', 'C. 붉은 줄 (붉은 밧줄)', 'D. 흰색 천'], 
          answer: 'C. 붉은 줄 (붉은 밧줄)' 
        },
        // [근거: PDF 79쪽] "만약 이 붉은 줄을 당신 집 창문에 매달아 놓지 않고... 오직 한 곳, 창문에 붉은 밧줄이 대롱대롱 걸려 있던 라합의 집만큼은 안전하게..."

        // 5번: 단답형
        { 
          type: 'short',
          question: '라합에게 정탐꾼들을 체포하러 군사들이 들이닥쳤을 때, 라합은 그들이 해 질 무렵 성문이 닫힐 때 어디 밖으로 떠났다고 둘러대며 군사들을 따돌렸나요? (2글자)', 
          answer: '성밖' 
        },
        // [근거: PDF 76쪽] "해가 질 무렵 성문이 닫힐 때 서둘러 떠났으니, 지금 당장 빨리 뒤쫓아가면 성 밖에서 잡을 수 있을지도 몰라요!"

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '이방 여인이었던 라합도 믿음으로 하나님의 백성(가족)이 되었습니다. 오늘 말씀을 통해 하나님께서 나를 자녀 삼아주신 사랑에 대해 느낀 점을 자유롭게 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      // 10과 본문 분위기에 어울리는 모던 테마 색상 (벽돌레드, 올리브그린, 네이비, 딥퍼플 등)
      const themes = ['#C05C46', '#4A7C59', '#3D617B', '#7A5C8E', '#D17A22', '#5B6275'];

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 이벤트 연결
      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          // 주관식 / 서술형 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 느낌을 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '85%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#2c3e50';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 유연한 정답 인정 로직 (예: '성밖' or '성밖으로', '종' 등)
          if (nAns === '성밖' && (nUser === '성밖' || nUser === '성밖으로' || nUser === '성외곽')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        // 결과 피드백 UI
        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #16a34a;'>멋진 생각을 나눠주어서 고마워요! 🌟</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #16a34a;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 버튼 및 인풋 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🎉' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#1e293b';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '16px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      // 최종 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "멋지게 퀴즈를 완료했어요! 하나님 안에서 승리하는 한 주 보내세요! 🌿";
        if (score === questions.length) {
          praiseMsg = "와우! 만점이에요! 성경 박사님이시네요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">10과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#e11d48; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#0284c7; color:#fff; margin-top:14px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화 (공백, 문장부호, 특수기호 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
