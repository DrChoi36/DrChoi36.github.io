<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (4과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', 'Malgun Gothic', sans-serif; 
      background: #eef2f3; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
    }

    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 20px; 
      color: #fff; 
      background-color: #4A90E2; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: all 0.5s ease; 
    }

    button { 
      margin: 10px; 
      padding: 15px 25px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
      box-shadow: 0 4px 0 #ccc;
    }
    button:active { transform: translateY(4px); box-shadow: none; }
    button:hover { background-color: #f9f9f9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    input[type="text"] { 
      padding: 12px; 
      font-size: 22px; 
      border-radius: 10px; 
      border: 2px solid #ddd; 
      width: 80%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    #result { 
      font-size: 28px; 
      margin-top: 30px; 
      color: #333; 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #feedback { 
      min-height: 50px; 
      margin-top: 20px; 
      font-size: 24px; 
      font-weight: bold; 
    }

    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #aaa;
      pointer-events: none;
    }

    .next-btn {
      background-color: #333 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 제4과</h2>
      <h3 style="color: #FFD700;">"필요한 자격"</h3>
      <p>오늘 배운 내용을 확인해볼까요?<br>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="이름을 입력하세요" />
      <br>
      <button id="start-btn">퀴즈 여행 시작! 🚀</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; color: #666; margin-bottom: 10px; font-weight: bold;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 25px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      const questions = [
        { 
          type: 'ox',   
          question: '바울은 에베소로 떠날 때, 디도를 크레테 섬에 남겨두어 교회의 일을 돌보게 했습니다.', 
          answer: 'O' 
        },
        { 
          type: 'fill', 
          question: '기억절: "모든 사람에게 구원을 주시는 하나님의 (      )가 나타나 우리를 양육하시되..." (디도서 2:11)', 
          answer: '은혜' 
        },
        { 
          type: 'mcq',  
          question: '바울이 말한 장로(지도자)의 자격 중 "가족 관계"에 대한 설명으로 옳은 것은 무엇인가요?', 
          options: ['여러 명의 아내를 두어야 함', '자녀들이 불순종해도 상관없음', '한 아내의 남편이어야 하며 자녀들도 믿는 사람이어야 함', '자녀들이 디오니소스 예배에 참여해야 함'], 
          answer: '한 아내의 남편이어야 하며 자녀들도 믿는 사람이어야 함' 
        },
        { 
          type: 'mcq',  
          question: '당시 크레테 교회 신자들이 직면한 가장 큰 외부적인 문제는 무엇이었나요?', 
          options: ['교회 건물의 부족', '거짓 가르침과 거짓 교사들', '로마 군대의 직접적인 공격', '식량과 물의 부족'], 
          answer: '거짓 가르침과 거짓 교사들' 
        },
        { 
          type: 'short',
          question: '바울은 장로가 하나님의 "이것"으로서 다른 사람들에게 참된 외교관이 되어야 한다고 했습니다. 두 글자인 "이것"은 무엇일까요?', 
          answer: '대사' 
        },
        { 
          type: 'any',  
          question: '오늘 공부한 장로의 자격들 중, 여러분이 가장 본받고 싶거나 멋지다고 생각하는 성품은 무엇인가요? 이유와 함께 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#4A90E2', '#50C878', '#FFB347', '#9370DB', '#FF6B6B', '#20B2AA'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("친구의 이름을 알려주세요!");
          return;
        }
        participantName = nameVal;
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.textContent = '';
        const q = questions[current];

        questionNumberEl.textContent = `Q ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '자유롭게 적어보세요' : '정답을 입력하세요';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkAnswer(input.value); });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length >= 2; 
        } else {
          isCorrect = normalize(userAns) === normalize(q.answer);
        }

        if (isCorrect) {
          feedbackEl.textContent = q.type === 'any' ? "멋진 생각이에요! 👍" : "정답입니다! 참 잘했어요! 🌟";
          feedbackEl.style.color = "#2E7D32";
          score++;
        } else {
          feedbackEl.textContent = `아쉬워요! 정답은 [ ${q.answer} ] 입니다. 📖`;
          feedbackEl.style.color = "#D32F2F";
        }

        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기' : '다음 문제로 고고!';
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let message = "";
        const finalScore = score;
        if(finalScore === questions.length) message = "완벽해요! 성경 박사님이시네요! 🏆";
        else if(finalScore >= 4) message = "정말 훌륭해요! 말씀을 아주 잘 들었군요! 😊";
        else message = "수고했어요! 조금 더 성경 이야기를 읽어보면 좋을 거예요! 📖";

        resultEl.innerHTML = `
          <h2 style="color: #4A90E2;">${participantName} 친구, 수고했어요!</h2>
          <div style="font-size: 60px; margin: 20px 0;">✨ ${finalScore} / ${questions.length} ✨</div>
          <p style="font-size: 22px; line-height: 1.5;">${message}</p>
          <button onclick="location.reload()" style="background-color: #50C878; color: white;">다시 도전하기</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
