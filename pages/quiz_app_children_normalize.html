<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (8과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #f0f8ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #4A6984; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #E2F0D9; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 8과</h2>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 8과 문제 데이터
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '바로 왕 앞에 선 요셉은 자신의 뛰어난 지혜와 꿈 해석 능력을 자랑스럽게 이야기하며 왕의 꿈을 풀어주었다.', 
          answer: 'X' 
        }, 
        // [근거: 본문 63쪽] "저는 스스로 꿈을 해석할 능력이 없습니다. 하지만 제가 믿는 하나님께서 왕에게 가장 올바르고 평안한 답을 알려주실 것입니다!"

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "친구는 (    )이/가 끊어지지 아니하고 형제는 위급한 때를 위하여 났느니라" (잠언 17:17)', 
          answer: '사랑' 
        },
        // [근거: 본문 61쪽 기억절]

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '꿈속에서 비쩍 마른 소 일곱 마리와 바짝 말라버린 야윈 이삭 일곱 개가 상징하는 것은 무엇이었나요?', 
          options: ['A. 7년 동안의 전쟁', 'B. 7년 동안의 흉년', 'C. 7년 동안의 전염병', 'D. 7년 동안의 평화'], 
          answer: 'B. 7년 동안의 흉년' 
        },
        // [근거: 본문 64쪽] "비쩍 마른 일곱 소와 야윈 이삭들은... 무서운 7년 동안의 흉년이 찾아올 것을 뜻합니다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '바로 왕이 답답한 꿈 때문에 화를 낼 때, 2년 전 감옥에서 자신의 꿈을 풀어주었던 요셉을 떠올리고 왕에게 추천한 사람은 누구인가요?', 
          options: ['A. 시위대장 보디발', 'B. 떡 만드는 관원장', 'C. 술 맡은 관원장', 'D. 이집트의 마술사'], 
          answer: 'C. 술 맡은 관원장'
        },
        // [근거: 본문 63쪽] "왕에게 음료를 바치던 신하(술 맡은 관원장)... 요셉이라는 히브리 청년입니다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '요셉은 다가올 흉년을 대비하기 위해 풍년 기간 동안 매년 수확한 곡식의 얼마를 저장해야 한다고 조언했나요?', 
          answer: '5분의 1' 
        },
        // [근거: 본문 64쪽] "매년 수확한 곡식의 5분의 1을 차곡차곡 저장하셔야 합니다."

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '어려운 상황에서도 언제나 하나님을 인정하고 겸손히 지혜를 구했던 요셉처럼, 여러분은 이번 8과를 통해 무엇을 느끼고 다짐했는지 자유롭게 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#3B5998', '#4A6984', '#2E8B57', '#6A5ACD', '#D96B27', '#8B4513']; // 8과 주제(애굽과 총리 요셉)에 어울리는 색상 테마

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면(다음 버튼이 있으면) 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 내용이 있으면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          
          // 유연한 정답 인정 예시 (5분의 1, 1/5 등)
          if (q.answer === '5분의 1' && (nUser === '1/5' || nUser === '오분의일')) {
            isCorrect = true;
          } else {
            isCorrect = nUser === nAns;
          }
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "#FFD700"; // 밝은 노란색
          score++;
        } else {
          feedbackEl.textContent = "틀렸습니다! ❌";
          feedbackEl.style.color = "#FFCCCC";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>${participantName} 학생은<br>
          8과 총 ${questions.length}문제 중<br>
          <span style="color:#D9534F; font-size:40px;">${score}</span>개를 맞췄어요!</h3>
          <p>참 잘했어요! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
