<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>소년반 성경 퀴즈 (12과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
    
    /* 모바일 우선 스타일링 */
    :root {
      --main-bg: #f5f7fa;
      --card-bg: #ffffff;
      --primary-color: #4A90E2;
      --accent-color: #FF6B6B;
      --text-dark: #2D3436;
    }

    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', sans-serif; 
      background: var(--main-bg); 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; 
      min-height: 100vh; 
      color: var(--text-dark);
      -webkit-tap-highlight-color: transparent;
    }

    #quiz-container { 
      width: 100%;
      max-width: 500px; 
      padding: 20px;
      box-sizing: border-box;
    }

    /* 상단 프로그레스 바 */
    #progress-container {
      width: 100%;
      height: 8px;
      background: #dfe6e9;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
      display: none;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary-color);
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 { font-size: 1.4rem; margin-top: 0; color: var(--primary-color); }
    p { font-size: 1.1rem; line-height: 1.5; }

    /* 버튼 스타일 최적화 */
    button { 
      width: 100%;
      margin: 8px 0; 
      padding: 16px; 
      font-size: 1.1rem; 
      border: 2px solid #eee; 
      border-radius: 15px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: var(--text-dark);
      font-weight: 700;
      transition: all 0.2s;
    }
    button:active { transform: scale(0.98); background-color: #f1f1f1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 정답 버튼 강조 */
    .btn-selected { background-color: var(--primary-color) !important; color: white !important; border-color: var(--primary-color); }

    input[type="text"] { 
      padding: 15px; 
      font-size: 1.2rem; 
      border-radius: 12px; 
      border: 2px solid #dfe6e9; 
      width: 100%; 
      box-sizing: border-box;
      text-align: center; 
      margin-bottom: 15px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary-color); }

    #feedback { 
      margin-top: 20px; 
      font-size: 1.2rem; 
      font-weight: bold; 
      min-height: 30px;
    }

    #footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.8rem;
      color: #b2bec3;
    }

    /* 결과 창 스타일 */
    .result-score { font-size: 3.5rem; font-weight: 800; color: var(--accent-color); margin: 10px 0; }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="progress-container"><div id="progress-bar"></div></div>

    <div id="name-input-area" class="card">
      <h2>📖 소년반 성경퀴즈 12과</h2>
      <p><strong>"유일한 친구"</strong><br>하나님을 신뢰하는 마음!</p>
      <input type="text" id="name-input" placeholder="이름을 입력하세요" maxlength="10" />
      <button id="start-btn" style="background: var(--primary-color); color: white; border: none;">퀴즈 시작하기 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 0.9rem; color: #636e72; margin-bottom: 8px; font-weight: bold;"></div>
      <div class="card">
        <div id="question-text" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 10px;"></div>
        <div id="answer-area"></div>
        <div id="feedback"></div>
      </div>
    </div>

    <div id="result" class="card" style="display:none;"></div>

    <div id="footer">Distributed by Dr. Choi</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      const questions = [
        { 
          type: 'ox',   
          question: '유다는 예수님이 늘 기도하시던 장소인 감람산 꼭대기에 계시다는 사실을 제사장들에게 알렸습니다.', 
          answer: 'O' 
        }, [cite: 14, 15]
        { 
          type: 'fill', 
          question: '기억절: "내 아버지여 만일 할 만하시거든 이 (    )을/를 내게서 지나가게 하옵소서 그러나 나의 원대로 마시옵고 아버지의 원대로 하옵소서"', 
          answer: '잔' 
        }, [cite: 8, 38]
        { 
          type: 'mcq',  
          question: '예수님이 겟세마네 동산에서 기도하실 때, 특별히 따로 데리고 가신 제자들은 누구인가요?', 
          options: ['베드로와 세베대의 아들들', '베드로, 안드레, 야고보', '유다와 나머지 제자들', '모든 제자들'], 
          answer: '베드로와 세베대의 아들들' 
        }, [cite: 37]
        { 
          type: 'mcq',  
          question: '예수님이 고통 속에 기도하고 돌아오셨을 때, 제자들은 무엇을 하고 있었나요?', 
          options: ['함께 간절히 기도했다', '도망갈 준비를 했다', '깊은 잠에 빠져 있었다', '유다를 기다리고 있었다'], 
          answer: '깊은 잠에 빠져 있었다'
        }, [cite: 39]
        { 
          type: 'short',
          question: '유다가 군인들과 함께 왔을 때, 예수님을 체포할 사람임을 알리기 위해 한 행동은 무엇인가요?', 
          answer: '입맞춤' 
        }, [cite: 19, 58, 59]
        { 
          type: 'any',  
          question: '가장 가까운 친구들이 잠들고 혼자 남겨진 상황에서도 예수님은 하나님을 신뢰하셨습니다. 여러분이 힘들 때 하나님께 하고 싶은 말을 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);

      function startGame() {
        if (!nameInput.value.trim()) { alert("이름을 입력해주세요!"); return; }
        participantName = nameInput.value.trim();
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        progressContainer.style.display = 'block';
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.textContent = '';
        const q = questions[current];
        const progress = ((current) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
        
        questionNumberEl.textContent = `QUESTION 0${current + 1}`;
        questionTextEl.textContent = q.question;
        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          ['O', 'X'].forEach(text => createBtn(text));
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '여기에 입력...' : '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '확인 완료';
          submitBtn.style.background = var(--primary-color);
          submitBtn.style.color = 'white';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;
        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') isCorrect = userAns.trim().length > 1;
        else isCorrect = normalize(userAns) === normalize(q.answer);

        if (isCorrect) {
          feedbackEl.textContent = "잘했어요! 정답입니다 ✨";
          feedbackEl.style.color = "#2ecc71";
          score++;
        } else {
          feedbackEl.textContent = q.type === 'any' ? "확인되었습니다!" : `아쉬워요! 정답: ${q.answer}`;
          feedbackEl.style.color = "#e74c3c";
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.background = "#2d3436";
        nextBtn.style.color = "white";
        nextBtn.style.marginTop = "15px";
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) { 
            progressBar.style.width = '100%';
            showResult(); 
          } else { 
            current++; 
            showQuestion(); 
          }
        });
        answerAreaEl.appendChild(nextBtn);
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h2>수고했어요, ${participantName}!</h2>
          <div class="result-score">${score}/${questions.length}</div>
          <p>예수님은 언제나 우리의<br>가장 좋은 친구가 되어주세요.</p>
          <button onclick="location.reload()" style="background:var(--primary-color); color:white;">다시 도전하기</button>
        `;
      }

      function normalize(str) {
        return str ? str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase() : '';
      }
    });
  </script>
</body>
</html>
