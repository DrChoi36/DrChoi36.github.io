<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (4과 - 하나님으로부터 도망치다)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #fdfbf7; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #1e293b;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #d97706; 
      box-shadow: 0 10px 25px rgba(217, 119, 6, 0.22); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #fffbeb; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #fde68a; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fee2e2;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #78716c; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🔥 소년반 성경퀴즈 4과 🌿</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"하나님으로부터 도망치다"<br>이름을 입력하고 낙심한 우리를 위로하시는 하나님을 만나보세요!</p>
      <input type="text" id="name-input" placeholder="예: 엘리야" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #b45309; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #78716c; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 4과: 하나님으로부터 도망치다 (열왕기상 19:1~18)
      const questions = [
        // 1번: OX 문제 (바람, 지진, 불과 세미한 음성)
        { 
          type: 'ox',   
          question: '호렙산 동굴 앞에 선 엘리야에게 강한 바람, 지진, 불이 지나간 후, 하나님께서는 부드러운 속삭임(세미한 소리) 가운데 계셨다.', 
          answer: 'O' 
        }, 
        // [근거: 본문 34, 36쪽] "강한 바람이 산을 찢고 바위를 흩어지게 했지만 하나님은 그 바람 속에 계시지 않았습니다... 다음에는 불이 산을 쓸고 지나갔지만 하나님은 그 불속에도 안 계셨습니다. 마지막으로 부드러운 속삭임이 있었습니다. 엘리야는 작은 속삭임 속에 하나님이 계신 것을 알았습니다."

        // 2번: 기억절 문제 (히브리서 13:5 빈칸 채우기)
        { 
          type: 'fill', 
          question: '기억절: "돈을 사랑하지 말고 있는 바를 족한 줄로 알라 그가 친히 말씀하시기를 내가 결코 너희를 (      )하지 아니하고 너희를 떠나지 아니하리라 하셨느니라" (히브리서 13:5)', 
          answer: '버리지' 
        },
        // [근거: 본문 33쪽 기억절] "내가 결코 너희를 버리지 아니하고 너희를 떠나지 아니하리라 하셨느니라(히브리서 13:5)"

        // 3번: 4지 선다형 (엘리야를 죽이겠다고 위협한 인물)
        { 
          type: 'mcq',  
          question: '갈멜산의 기적과 비가 내린 소식을 듣고도 회개하지 않고, 엘리야에게 심부름꾼을 보내 "내일 이맘때에 반드시 네 생명을 빼앗겠다"며 위협한 인물은 누구인가요?', 
          options: [
            'A. 이세벨 왕비', 
            'B. 아달랴 왕비', 
            'C. 미갈 공주', 
            'D. 헤로디아'
          ], 
          answer: 'A. 이세벨 왕비' 
        },
        // [근거: 본문 33쪽] "그러나 이세벨 왕비는 감동을 받지 않았습니다... 이세벨 왕비의 심부름꾼이 엘리야 선지자에게 찾아와 무서운 경고를 전했습니다."

        // 4번: 4지 선다형 (바알에게 무릎 꿇지 않은 남은 자의 수)
        { 
          type: 'mcq',  
          question: '"오직 나만 홀로 남았습니다"라며 외로워하고 절망하던 엘리야에게, 하나님께서 바알에게 절하지 않고 여호와를 충성스럽게 따르고 있다고 알려주신 남은 사람들의 수는 몇 명이었나요?', 
          options: [
            'A. 70명', 
            'B. 700명', 
            'C. 7,000명', 
            'D. 12,000명'
          ], 
          answer: 'C. 7,000명' 
        },
        // [근거: 본문 36쪽] "주님께서는 바알에게 절하지 않고 하나님을 따르는 7,000명이 있다며 '너는 네 길을 돌이켜' 가라고 말씀하셨습니다."

        // 5번: 단답형 (엘리야가 40일 밤낮을 걸어 도착한 하나님의 산)
        { 
          type: 'short',
          question: '천사가 준 구운 빵과 물을 먹고 힘을 얻은 엘리야가 40일 동안 걸어가 동굴에 머물렀던 남쪽 팔레스타인의 거룩한 산 이름은 무엇인가요?', 
          answer: '호렙산' 
        },
        // [근거: 본문 34쪽] "엘리야는 40일 동안 160km 이상을 여행했습니다. 마침내 남쪽 팔레스타인의 호렙산에서 엘리야는 멈추었습니다."

        // 6번: 느낀점 (자유 서술형)
        { 
          type: 'any',  
          question: '갈멜산에서 큰 승리를 거두었던 엘리야도 두려움과 외로움 때문에 낙심하여 도망쳤지만, 하나님께서는 따뜻한 음식과 세미한 음성으로 다시 힘을 주셨습니다. 여러분도 걱정이나 무서움으로 낙심될 때 하나님께서 나와 함께하신다는 것을 어떻게 기억하고 힘을 얻고 싶은지 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 광야, 황혼, 로뎀나무 그늘, 호렙산 동굴, 고요한 위로를 상징하는 앰버/어스/브라운 톤 테마
      const themes = ['#D97706', '#B45309', '#92400E', '#78350F', '#854D0E', '#713F12'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 결심을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#d97706';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 호렙산 유연 처리 (호렙, 호렙산, 시내산)
          if (nAns === '호렙산' && (nUser === '호렙산' || nUser === '호렙' || nUser === '시내산')) {
            isCorrect = true;
          } else if (nAns === '버리지' && (nUser === '버리지' || nUser === '버리시지' || nUser === '버리지아니하고')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #b45309;'>지치고 무서울 때마다 세미한 음성으로 우리를 위로하시는 하나님을 신뢰하겠다는 멋진 다짐이에요! 🌿🙏✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #059669;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 기존 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#d97706';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "가장 낙심하고 힘든 순간에도 엘리야를 찾아와 먹이시고 세미한 음성으로 품어주셨던 하나님께서 여러분의 곁에 언제나 함께하십니다! 🌿🕊️";
        if (score === questions.length) {
          praiseMsg = "놀라워요! 만점입니다! 지친 우리를 결코 버리지 않으시는 하나님의 은혜를 깊이 이해한 소년반 최고의 믿음 용사입니다! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">4과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#d97706; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#d97706; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화 (공백, 문장부호 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
