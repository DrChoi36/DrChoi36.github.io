<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (6과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #0f172a;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #2563eb; 
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #0f172a; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #eff6ff; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #bfdbfe; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #0f172a; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 22px; 
      font-weight: 800; 
      color: #0f172a; 
    }

    .alert-msg {
      color: #fecaca;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #64748b; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 화면 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">📜 소년반 성경퀴즈 6과 🧱</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"느헤미야의 일지"<br>이름을 입력하고 성벽 재건을 향한 느헤미야의 기도의 현장으로 가볼까요?</p>
      <input type="text" id="name-input" placeholder="예: 최재희" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #2563eb; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 문제 화면 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 6과 퀴즈 데이터 (느헤미야 1, 2장)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '아닥사스다 왕이 느헤미야에게 무엇을 원하는지 물었을 때, 느헤미야는 왕에게 대답하기 전에 먼저 마음속으로 하나님께 기도드렸다.', 
          answer: 'O' 
        }, 
        // [근거: 교재 48쪽] "왕은 즉시 내게 무엇을 원하는지 물었다. 나는 답변하기 전에 마음속으로 기도를 드렸다. 그리고 예루살렘 성벽 재건을 위해 돌아가기를 원한다고 말했다."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "너희는 여호와께서 너희를 위하여 행하신 그 큰 일을 생각하여 오직 그를 경외하며 너희의 마음을 다하여 (      ) 섬기라" (사무엘상 12:24)', 
          answer: '진실히' 
        },
        // [근거: 교재 47쪽 기억절] "너희의 마음을 다하여 진실히 섬기라 (사무엘상 12:24)"

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '페르시아 수산 궁에서 느헤미야에게 예루살렘 성벽이 무너지고 문들이 불타 버렸다는 안타까운 소식을 전해준 사람은 누구인가요?', 
          options: [
            'A. 하나니', 
            'B. 산발랏', 
            'C. 도비야', 
            'D. 게셈'
          ], 
          answer: 'A. 하나니' 
        },
        // [근거: 교재 47쪽] "하나니가 유다에서 오늘 도착했다. 그와 그의 친구들이 예루살렘 성벽이 무너져 내리고 문이 불타 버렸다고 말했다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '느헤미야는 페르시아의 아닥사스다 왕을 가까이에서 모시며 어떤 직책을 맡고 있었나요?', 
          options: [
            'A. 군대 장관', 
            'B. 술 관원 (술 맡은 관원)', 
            'C. 문지기', 
            'D. 재무관'
          ], 
          answer: 'B. 술 관원 (술 맡은 관원)' 
        },
        // [근거: 교재 47, 48쪽 본문 및 성경 느 1:11] 왕의 잔을 맡아 올리고 점심/음식을 차리며 왕의 안전과 음료를 책임지던 직책

        // 5번: 단답형
        { 
          type: 'short',
          question: '느헤미야의 간청을 들은 이스라엘 백성들이 다 함께 용기를 내어 외치며 시작한 일은 예루살렘 성벽 (      )이었습니다. 빈칸에 들어갈 두 글자는 무엇일까요?', 
          answer: '재건' 
        },
        // [근거: 교재 48, 50쪽] "예루살렘 성벽 재건을 위해... 그들이 건축(재건)을 시작하자고 했다."

        // 6번: 느낀점 적기
        { 
          type: 'any',  
          question: '편안한 왕궁에 머무를 수 있었음에도 고향 공동체의 아픔을 위해 눈물로 금식하며 기도했던 느헤미야처럼, 나는 오늘 누구를 위해 진심 어린 기도와 도움의 손길을 전하고 싶은지 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 수산 궁전의 신뢰와 성벽 재건의 견고함을 나타내는 블루/네이비/슬레이트 테마
      const themes = ['#2563EB', '#1D4ED8', '#1E40AF', '#0F766E', '#0369A1', '#334155'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#2563eb';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 유연한 정답 인정 로직 (띄어쓰기, 유사어 허용)
          if (nAns === '진실히' && (nUser.includes('진실') || nUser === '진실하게')) {
            isCorrect = true;
          } else if (nAns === '재건' && (nUser.includes('재건') || nUser.includes('건축') || nUser === '보수')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #1d4ed8;'>느헤미야처럼 이웃과 하나님의 일에 따뜻한 관심을 갖는 멋진 다짐입니다! 🕊️✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #059669;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#2563eb';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "어려운 상황에서도 먼저 하나님께 무릎 꿇고 기도하며 공동체를 바로 세운 느헤미야의 믿음을 배우는 소년반 친구가 되길 축복합니다! 📜🧱";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 느헤미야처럼 하나님 나라를 온 마음과 진실함으로 섬길 소년반 최고의 리더입니다! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">6과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#2563eb; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#2563eb; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
