<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (12과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #eef2f3; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #2c3e50; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 22px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"], textarea { 
      padding: 15px; 
      font-size: 20px; 
      border-radius: 8px; 
      border: 2px solid #ccc; 
      width: 80%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }
    textarea { height: 100px; text-align: left; }

    /* 결과 및 피드백 */
    #result { 
      font-size: 28px; 
      margin-top: 30px; 
      color: #333; 
      background: #fff; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #feedback { 
      min-height: 50px; 
      margin-top: 20px; 
      font-size: 26px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }

    .highlight { color: #f1c40f; }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0;">소년반 성경퀴즈 12과</h2>
      <p style="font-size: 20px;">"유일한 친구"</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="이름 입력" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 12과 문제 데이터
      const questions = [
        { 
          type: 'ox',   
          question: '유다가 예수님을 배반하기 위해 찾아간 사람은 대제사장 가야바였다.', 
          answer: 'O' 
        },
        { 
          type: 'fill', 
          question: '기억절: "조금 나아가사 얼굴을 땅에 대시고 엎드려 기도하여 이르시되 내 아버지여 만일 할 만하시거든 이 (    )을/를 내게서 지나가게 하옵소서..." (마 26:39)', 
          answer: '잔' 
        },
        { 
          type: 'mcq',  
          question: '예수님이 제자들과 함께 기도하기 위해 가신 곳의 이름은 무엇인가요?', 
          options: ['A. 갈멜산', 'B. 겟세마네 동산', 'C. 갈릴리 호수', 'D. 시내산'], 
          answer: 'B. 겟세마네 동산' 
        },
        { 
          type: 'mcq',  
          question: '유다가 군인들에게 "내가 (    ) 하는 사람을 체포하세요"라고 말하며 신호를 보냈습니다. 빈칸에 들어갈 행동은?', 
          options: ['A. 손을 흔드는', 'B. 큰 소리로 부르는', 'C. 입을 맞추는', 'D. 손을 잡는'], 
          answer: 'C. 입을 맞추는'
        },
        { 
          type: 'short',
          question: '예수님이 기도하신 후 제자들에게 돌아왔을 때, 제자들은 무엇을 하고 있었나요? (1글자)', 
          answer: '잠' 
        },
        { 
          type: 'any',  
          question: '가장 가까운 친구에게 실망하거나 혼자라고 느꼈을 때, 우리는 누구를 신뢰해야 할까요? 여러분의 생각을 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';
      // 12과 분위기: 어두운 밤 겟세마네 테마 (남색, 보라색, 짙은 녹색)
      const themes = ['#2c3e50', '#8e44ad', '#27ae60', '#2980b9', '#34495e', '#16a085'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 입력해주세요!");
          return;
        }
        participantName = nameVal;
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.textContent = '';
        const q = questions[current];

        questionNumberEl.textContent = `질문 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else if (q.type === 'any') {
          const textarea = document.createElement('textarea');
          textarea.placeholder = '여기에 생각을 적어주세요...';
          answerAreaEl.appendChild(textarea);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.addEventListener('click', () => checkAnswer(textarea.value));
          answerAreaEl.appendChild(submitBtn);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkAnswer(input.value); });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 1;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          // '잠'이 정답인 문제에서 '잠을 잤다' 등도 인정하고 싶다면 포함
          if (current === 4 && nUser.includes('잠')) isCorrect = true;
          else isCorrect = (nUser === nAns);
        }

        if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color:green'>정답이에요! 🌟</span>";
          score++;
        } else {
          feedbackEl.innerHTML = `<span style='color:red'>아쉬워요!</span><br><small style='font-size:16px; color:#555;'>정답: ${q.answer}</small>`;
        }

        const inputs = answerAreaEl.querySelectorAll('button, input, textarea');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인 ▶' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#2c3e50';
        nextBtn.style.color = '#fff';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) showResult();
          else { current++; showQuestion(); }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        let comment = score === questions.length ? "완벽해요! 성경 박사님이시네요!" : "정말 잘했어요! 다음 과도 기대돼요!";
        
        resultEl.innerHTML = `
          <h2 style="color:#2c3e50;">${participantName} 어린이, 수고했어요!</h2>
          <div style="font-size: 40px; margin: 20px 0;">점수: <span style="color:red;">${score}</span> / ${questions.length}</div>
          <p>${comment}</p>
          <button onclick="location.reload()" style="background:#2c3e50; color:white;">다시 하기</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
