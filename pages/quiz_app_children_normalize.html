<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (7과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #fdfbf7; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #1e293b;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #b45309; 
      box-shadow: 0 10px 25px rgba(180, 83, 9, 0.25); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #fffbeb; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #fed7aa; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #b45309;
      box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 22px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fecaca;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #78716c; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 화면 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">📐 소년반 성경퀴즈 7과 🧱</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"계획을 세움"<br>이름을 입력하고 온 이스라엘이 한마음으로 성벽을 중건하던 현장으로 떠나볼까요?</p>
      <input type="text" id="name-input" placeholder="예: 최재희" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #b45309; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 문제 화면 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #78716c; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 7과 퀴즈 데이터 (느헤미야 2, 3장)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '성벽 재건에는 향품 장사, 금장색, 상인 등 다양한 직업의 사람들과 아들이 없어 딸을 데려와 함께 일한 가족들도 적극적으로 참여했다.', 
          answer: 'O' 
        }, 
        // [근거: 교재 53쪽] "아들이 없는 사람은 성전 재건을 돕겠다며 딸을 데려왔다. 향품 장사들, 상인들, 금장색들, 성전지기들은 가장 활발한 전문가들이다."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 모두가 같은 말을 하고 너희 가운데 분쟁이 없이 같은 마음과 같은 뜻으로 온전히 (      )" (고린도전서 1:10)', 
          answer: '합하라' 
        },
        // [근거: 교재 53쪽 기억절] "같은 마음과 같은 뜻으로 온전히 합하라 (고린도전서 1:10)"

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '모든 그룹이 한마음으로 협력하여 일할 때, 대다수가 손가락 하나 움직이지 않고 협조하지 않았던 귀족들은 어느 지역 사람이었나요?', 
          options: [
            'A. 여리고 사람들', 
            'B. 드고아 귀족들', 
            'C. 기브온 거민들', 
            'D. 미스바 백성들'
          ], 
          answer: 'B. 드고아 귀족들' 
        },
        // [근거: 교재 53, 56쪽] "단지 드고아의 귀족들만 예외적이었다. 몇 사람은 도움을 주었지만 대다수가 손가락 하나 움직이지 않았다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '지칠 줄 모르는 모범적인 일꾼으로, 가장 먼저 앞장서서 성벽의 "양문" 재건 책임을 맡아 다른 사람들에게 큰 용기를 준 사람은 누구인가요?', 
          options: [
            'A. 대제사장 엘리아십', 
            'B. 암몬 사람 도비야', 
            'C. 호론 사람 산발랏', 
            'D. 아랍 사람 게셈'
          ], 
          answer: 'A. 대제사장 엘리아십' 
        },
        // [근거: 교재 54쪽] "대제사장 엘리아십은 지칠 줄 모르는 일꾼이다. 그는 심지어 재건축을 위해 양문을 책임졌다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '산발랏 일당이 일꾼들을 모욕하고 방해할 때, 느헤미야는 일꾼들에게 "하늘의 하나님이 우리로 (      ) 하실 것이다"라고 외치며 용기를 북돋웠습니다. 괄호 안에 들어갈 단어는 무엇일까요?', 
          answer: '형통케' 
        },
        // [근거: 교재 54쪽 본문 및 느헤미야 2:20] "하늘의 하나님이 우리로 형통케 하실 것이다" (형통, 형통하게 모두 인정)

        // 6번: 느낀점 적기
        { 
          type: 'any',  
          question: '각자의 은사와 재능은 다르지만 서로 부족함을 채워주며 아름다운 성벽을 완성했던 이스라엘 백성들처럼, 내가 우리 반이나 교회, 가정에서 협력하여 도울 수 있는 일은 무엇인지 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 성벽과 성문, 협력과 연합을 상징하는 따뜻한 브라운, 앰버, 올리브 톤
      const themes = ['#B45309', '#9A3412', '#78350F', '#4D7C0F', '#047857', '#475569'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#b45309';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 유연한 정답 인정 로직 (띄어쓰기, 유사어 허용)
          if (nAns === '합하라' && (nUser.includes('합하라') || nUser === '하나되라' || nUser === '연합하라')) {
            isCorrect = true;
          } else if (nAns === '형통케' && (nUser.includes('형통') || nUser === '형통하게' || nUser === '형통케')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #b45309;'>한마음으로 연합하여 하나님의 교회를 세워가는 참 멋진 다짐입니다! 🤝🧱</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #059669;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#b45309';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "철저한 계획과 연합된 마음으로 하나님을 힘차게 섬기는 소년반 리더가 되기를 축복합니다! 📐🧱";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 같은 마음과 뜻으로 온전히 합하여 승리하는 소년반 최고의 협동왕입니다! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">7과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#b45309; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#b45309; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
