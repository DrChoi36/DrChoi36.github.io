<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (6과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #fff8f0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #D9822B; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #F7CAC9; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 6과</h2>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    // 화면이 완전히 로딩된 후 코드를 실행하도록 설정
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 6과 문제 데이터 ("동생을 팔다")
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '요셉의 맏형 르우벤은 처음부터 동생 요셉을 죽여서 없애 버리자고 형제들을 부추겼다.', 
          answer: 'X' 
        }, 
        // [근거: 본문 47쪽] 맏형 르우벤은 "요셉을 죽이지는 말고, 그냥 저기 있는 빈 우물 속에 던져 넣자"며 몰래 요셉을 구해내려 했습니다.

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "진리를 말하는 자는 의를 나타내어도 (    ) 증인은 속이는 말을 하느니라" (잠언 12:17)', 
          answer: '거짓' 
        },
        // [근거: 본문 47쪽] "진리를 말하는 자는 의를 나타내어도 거짓 증인은 속이는 말을 하느니라"

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '요셉을 우물에서 꺼내 이집트(애굽) 상인들에게 노예로 팔아버리자고 제안한 형제는 누구인가요?', 
          options: ['A. 르우벤', 'B. 유다', 'C. 시므온', 'D. 레위'], 
          answer: 'B. 유다' 
        },
        // [근거: 본문 49쪽] "그 모습을 본 유다가 솔깃한 목소리로 형제들에게 제안했습니다... 상인들에게 노예로 팔아버리는 게 어때?"

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '형들은 요셉을 노예로 판 뒤, 아버지를 속여 요셉이 야생 동물에게 죽은 것처럼 꾸미기 위해 요셉의 옷에 무엇을 묻혔나요?', 
          options: ['A. 염소의 피', 'B. 붉은 흙', 'C. 포도즙', 'D. 소의 피'], 
          answer: 'A. 염소의 피'
        },
        // [근거: 본문 51쪽] "하지만 다른 형들은 슬퍼하기는커녕 염소 한 마리를 죽이느라... 요셉에게서 빼앗은 옷에 염소의 붉은 피를 잔뜩 바르고 있었습니다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '노예로 밧줄에 묶여 끌려가던 절망적인 순간, 요셉은 아버지의 교훈을 기억하며 온전히 누구를 믿고 기도하기로 결심했나요? (3글자)', 
          answer: '하나님' 
        },
        // [근거: 본문 50~51쪽] "...요셉은 아버지가 늘 말씀해 주시던 '힘들 때면 언제나 하나님께 기도하라'는 교훈을 실천하겠다고 굳게 결심했습니다."

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '억울하거나 절망적인 상황에서도 하나님을 온전히 의지하기로 선택한 요셉처럼, 나에게 어려운 일이 생겼을 때 어떻게 기도하고 행동할지 느낀 점을 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#D9822B', '#8C4A32', '#4A6984', '#6B5B95', '#D9534F']; // 광야의 분위기와 중후한 느낌을 담은 색상

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창 (fill, short, any)
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '느낀 점 작성 후 제출' : '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 느낀 점은 글자가 적혀있으면 통과
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          
          if (nAns === '하나님' && (nUser === '하나님' || nUser === '여호와')) {
            isCorrect = true;
          } else {
            isCorrect = nUser === nAns;
          }
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "#FFD700"; // 황금색
          score++;
        } else {
          feedbackEl.textContent = "틀렸습니다! ❌";
          feedbackEl.style.color = "#FFCCCC";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>${participantName} 학생은<br>
          6과 총 ${questions.length}문제 중<br>
          <span style="color:red; font-size:40px;">${score}</span>개를 맞췄어요!</h3>
          <p>수고했어요! 훌륭합니다! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
