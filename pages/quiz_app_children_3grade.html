<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유년반 교과 퀴즈 (5과 - 두 번이나 복을 받음)</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Noto+Sans+KR:wght@500;700;800&display=swap');
    
    * {
      box-sizing: border-box;
    }

    body { 
      margin: 0; padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #fffbebf5; /* 5과 테마: 따뜻하고 기분 좋은 연노랑/골드 */
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 22px; 
    }

    #quiz-container { 
      width: 92%; 
      max-width: 620px; 
      text-align: center; 
      padding: 20px 10px 70px 10px; 
    }

    .question-box, .input-box { 
      padding: 30px 24px; 
      border-radius: 20px; 
      color: #fff; 
      background-color: #f59e0b; /* 활기찬 주황/골드 색상 */
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
      line-height: 1.6;
      word-break: keep-all;
    }

    .input-box h2 {
      margin-top: 0;
      font-size: 28px;
    }

    button { 
      margin: 8px; 
      padding: 14px 28px; 
      font-size: 20px; 
      border: none; 
      border-radius: 14px; 
      cursor: pointer; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: bold;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.15s ease;
    }

    button:active { 
      transform: translateY(3px); 
      box-shadow: none; 
    }

    button:hover { 
      background-color: #fef3c7; 
    }

    button:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 16px 20px;
    }

    input[type="text"] { 
      padding: 14px; 
      font-size: 22px; 
      border-radius: 12px; 
      border: 3px solid #f59e0b; 
      width: 80%; 
      text-align: center; 
      margin-bottom: 20px; 
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #d97706;
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 35px 25px; 
      border-radius: 24px; 
      border: 5px solid #f59e0b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 24px; 
      font-weight: bold; 
      word-break: keep-all;
    }

    #footer {
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%;
      text-align: center; 
      font-size: 14px; 
      color: #94a3b8; 
      pointer-events: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>유년반 성경퀴즈 5과</h2>
      <p style="font-size: 22px; font-weight: bold; color: #fef3c7;">두 번이나 복을 받음</p>
      <p>이름을 입력하고 신나게 시작해 볼까요?</p>
      <input type="text" id="name-input" placeholder="예: 홍길동" />
      <br>
      <button id="start-btn">퀴즈 시작하기 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #64748b; margin-bottom: 12px; font-weight: bold;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi | 유년반 교과 5과</div>

  <script>
    'use strict';

    const questions = [
      { 
        type: 'ox',   
        question: '하나님께서는 우리가 구하거나 생각하는 것 이상으로 아주 크고 좋은 복을 주시는 분이세요.', 
        answer: 'O',
        comment: '맞아요! 하나님께서는 수넴 여인처럼 하나님을 사랑하는 자녀에게 더 넘치는 축복을 선물로 주세요!' 
      }, 
      { 
        type: 'fill', 
        question: '기억절: "우리가 구하거나 생각하는 모든 것에 더 (    ) 능히 하실 이에게" (에베소서 3:20)', 
        answer: '넘치도록',
        comment: '잘했어요! 하나님은 언제나 우리가 상상하는 것보다 훨씬 더 넘치게 채워주신답니다!' 
      },
      { 
        type: 'mcq',  
        question: '수넴 여인과 남편이 엘리사 선지자가 편히 쉴 수 있도록 방에 준비해둔 물건이 아닌 것은 무엇일까요?', 
        options: ['A. 침대와 촛대', 'B. 책상과 의자', 'C. 컴퓨터', 'D. 쉬어갈 수 있는 방'], 
        answer: 'C. 컴퓨터',
        comment: '딩동댕! 수넴 여인은 엘리사를 위해 침대, 책상, 의자, 촛대를 정성껏 준비했어요.' 
      },
      { 
        type: 'mcq',  
        question: '엘리사 선지자가 하나님께 기도하고 소년의 몸 위에 엎드렸을 때, 소년은 몇 번 재채기를 하고 다시 살아났나요?', 
        options: ['A. 1번', 'B. 3번', 'C. 5번', 'D. 일곱 번(7번)'], 
        answer: 'D. 일곱 번(7번)',
        comment: '정답이에요! 아픈 소년이 일곱 번 재채기를 하고 기적처럼 살아났어요!' 
      },
      { 
        type: 'short',
        question: '엘리사 선지자를 위해 방을 만들고 기쁨으로 정성껏 식사를 대접했던 여인이 살던 마을 이름은 무엇일까요? (2글자)', 
        answer: '수넴', 
        comment: '최고예요! 수넴 마을의 여인은 하나님과 선지자를 정성껏 섬겨서 큰 복을 받았답니다!' 
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    const themes = ['#f59e0b', '#d97706', '#b45309', '#ea580c', '#c2410c'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { 
        alert("이름을 꼭 알려주세요!"); 
        return; 
      }
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
      questionTextEl.textContent = q.question;
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O'); 
        createBtn('X');
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt, true));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '정답을 적어보세요';
        answerAreaEl.appendChild(input);
        
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '정답 확인';
        submitBtn.style.backgroundColor = themes[current % themes.length];
        submitBtn.style.color = '#fff';
        submitBtn.onclick = () => checkAnswer(input.value);
        
        answerAreaEl.appendChild(document.createElement('br'));
        answerAreaEl.appendChild(submitBtn);
        
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text, isBlock = false) {
      const btn = document.createElement('button');
      btn.textContent = text;
      if (isBlock) {
        btn.className = 'mcq-btn';
      }
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if(answerAreaEl.querySelector('.next-btn')) return;
      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short') {
        isCorrect = normalize(userAns).includes(normalize(q.answer));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:#059669;'>우와! 정말 대단해요! 정답입니다! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:#dc2626;'>아쉬워요! 정답은 [${q.answer}] 입니다. ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '18px';
      commentDiv.style.color = '#334155';
      commentDiv.style.marginTop = '12px';
      commentDiv.style.fontWeight = 'normal';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 보기 🎉' : '다음 문제 ▶';
      nextBtn.style.backgroundColor = '#1e293b';
      nextBtn.style.color = '#fff';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(document.createElement('br'));
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length ? "대단해요! 최고의 성경 박사님이군요! 👑" : "정말 수고했어요! 다음 과도 즐겁게 공부해요! 👏";
      resultEl.innerHTML = `
        <h2>축하해요, ${participantName} 어린이!</h2>
        <div style="font-size: 60px; margin: 20px 0;">🎁✨</div>
        <p>우리 어린이의 5과 점수는</p>
        <p><span style="color:#d97706; font-size:48px; font-weight:bold;">${score} / ${questions.length}</span></p>
        <p style="font-weight:bold; color: #334155;">${message}</p>
        <button onclick="location.reload()" style="background-color: #f59e0b; color: #fff;">한 번 더 풀기</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
