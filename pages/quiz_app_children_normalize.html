<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (12과 - 패배 가운데 승리하다)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    /* 전체 화면 스타일링 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #eef2f6; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #2d3748;
    }

    /* 퀴즈 메인 컨테이너 */
    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    /* 질문 및 시작 카드 박스 */
    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #4A3B32; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.14); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    /* 인터랙티브 버튼 디자인 */
    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f8fafc; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    /* 객관식 보기 버튼 (전체 폭) */
    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    /* 텍스트 입력창 스타일링 */
    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #cbd5e1; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* 결과창 및 정답 피드백 */
    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    /* 안내 경고 메시지 */
    .alert-msg {
      color: #f87171;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* 고정 푸터 */
    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #94a3b8; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🏛️ 소년반 성경퀴즈 12과</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"패배 가운데 승리하다"<br>이름을 입력하고 퀴즈를 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 삼손" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #f8fafc; color: #1e293b; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 12과: 패배 가운데 승리하다 (사사기 16:23~31 / 고린도전서 15:57)
      const questions = [
        // 1번: OX 문제 (사실 관계 및 핵심 교훈 확인)
        { 
          type: 'ox',   
          question: '블레셋 사람들은 다곤 신전에서 승리의 축제를 열며 기고만장해 있었지만, 눈먼 삼손이 자신의 잘못을 인정하고 하나님께 간절히 회개했을 때 하나님은 그의 마지막 기도를 들어주셨다.', 
          answer: 'O' 
        }, 
        // [근거: PDF 89~92쪽] "삼손은 자신이 스스로 문제를 자초했다는 것을 솔직하게 인정했기 때문이에요... 비록 큰 잘못을 저지르고 망가진 몸이었지만, 하나님은 여전히 삼손을 사랑하고 계셨고 그의 기도를 용서해 주셨던 거예요."

        // 2번: 기억절 문제 (고린도전서 15:57 빈칸)
        { 
          type: 'fill', 
          question: '기억절: "우리 주 예수 그리스도로 말미암아 우리에게 (     )를 주시는 하나님께 감사하노니" (고린도전서 15:57)', 
          answer: '승리' 
        },
        // [근거: PDF 89쪽] "우리 주 예수 그리스도로 말미암아 우리에게 승리를 주시는 하나님께 감사하노니"

        // 3번: 4지 선다형 (본문 세부 지명 확인)
        { 
          type: 'mcq',  
          question: '삼손이 갇혀 무거운 맷돌을 돌리던 감옥과 축제가 벌어졌던 거대한 다곤 신전이 있던 블레셋의 도시 이름은 어디인가요?', 
          options: [
            'A. 가자', 
            'B. 여리고', 
            'C. 다메섹', 
            'D. 욥바'
          ], 
          answer: 'A. 가자' 
        },
        // [근거: PDF 89쪽] "지금 '가자'라는 블레셋 사람들의 도시에 있는 거대한 다곤 신전에는..."

        // 4번: 4지 선다형 (본문 세부 등장인물 확인)
        { 
          type: 'mcq',  
          question: '지치고 눈먼 삼손을 감옥에서 신전으로 인도해 주고, 신전을 지탱하는 큰 기둥에 몸을 기댈 수 있게 자리를 잡아준 사람은 누구인가요?', 
          options: [
            'A. 블레셋 군대 장관', 
            'B. 다곤 신전의 제사장', 
            'C. 어린 소년', 
            'D. 이스라엘의 장로'
          ], 
          answer: 'C. 어린 소년' 
        },
        // [근거: PDF 92쪽] "삼손은 감옥에서부터 자신을 신전으로 인도해 준 어린 소년을 향해 조용히 가쁜 숨을 내쉬며 말했습니다... 소년은 발을 질질 끌며 힘들어하는 삼손을 안내해 신전 중앙에 있는 거대한 두 기둥 사이에 삼손이 몸을 기댈 수 있도록 도와주었습니다."

        // 5번: 단답형 (핵심 키워드)
        { 
          type: 'short',
          question: '블레셋 사람들이 이스라엘의 영웅 삼손을 사로잡은 후, 하나님보다 더 강하다며 제사를 드리고 찬양했던 블레셋 우상 신의 이름은 무엇인가요? (2글자)', 
          answer: '다곤' 
        },
        // [근거: PDF 89~90쪽] "그들은 자신들이 믿는 '다곤' 신이 이스라엘의 하나님보다 더 강하다며... 수많은 사람이 다곤 신이 자신들의 원수인 삼손을 넘겨주었다며..."

        // 6번: 느낀점 (type: 'any')
        { 
          type: 'any',  
          question: '삼손은 자신의 힘과 쾌락을 좇다 비참하게 넘어졌지만, 자신의 약함을 인정하고 온전히 하나님을 의지했을 때 진짜 승리를 경험했습니다. 내 힘으로 고치기 힘든 나쁜 습관이나 어려움이 있을 때, 하나님께 어떻게 도움을 구하고 승리할 수 있을지 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 12과 삼손의 고난과 반전의 승리를 표현하는 품격 있는 테마 색상 팔레트
      const themes = ['#4A3B32', '#2E4057', '#603A40', '#3F5E5A', '#5B4B6F', '#6D4C41'];

      // HTML DOM 요소 참조
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          // 단답형, 빈칸채우기, 서술형 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#1e293b';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 다곤 신, 다곤신 등 유연한 정답 인정
          if (nAns === '다곤' && (nUser === '다곤' || nUser === '다곤신')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        // 결과 피드백 UI 업데이트
        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #16a34a;'>마음을 담은 멋진 다짐을 적어주어서 고마워요! 🌟</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #16a34a;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 진행 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#1e293b';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "승리는 우리의 힘이 아니라 하나님께로부터 오는 선물임을 항상 기억하는 멋진 친구가 되길 축복해요! 🛡️✨";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 겸손하게 하나님만 의지하는 멋진 성경 박사님이에요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">12과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#e11d48; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#0284c7; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화: 띄어쓰기, 문장 부호, 특수기호 제거 및 소문자 통일
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
