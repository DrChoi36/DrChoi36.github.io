<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>삼육중앙교회 소년반 교과 퀴즈 (9과: 하나님께 영광을 돌림)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
    
    body { 
      margin: 0; padding: 0; 
      font-family: 'Noto Sans KR', sans-serif; 
      background: #eff6ff; /* 9과 테마: 하나님께 영광을 돌리는 맑고 깊은 로열 블루 배경 */
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; font-size: 22px; 
      word-break: keep-all;
    }

    #quiz-container { width: 92%; max-width: 620px; text-align: center; padding: 20px 0 70px; }

    .question-box, .input-box { 
      padding: 30px 25px; border-radius: 18px; color: #fff; 
      background-color: #1d4ed8; /* 9과 메인 컬러: 로열 블루 */
      box-shadow: 0 6px 18px rgba(29, 78, 216, 0.2);
      line-height: 1.55;
    }

    .badge {
      display: inline-block;
      background-color: #fbbf24;
      color: #1e3a8a;
      font-size: 15px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    button { 
      margin: 8px; padding: 14px 24px; font-size: 20px; 
      border: none; border-radius: 12px; cursor: pointer; 
      background-color: #fff; color: #1e293b; font-weight: bold;
      box-shadow: 0 3px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    button:active { transform: translateY(3px); box-shadow: none; }
    button:hover:not(:disabled) { background-color: #dbeafe; }
    button:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .mcq-btn {
      display: block;
      width: 90%;
      margin: 10px auto;
      text-align: left;
      padding-left: 20px;
    }

    input[type="text"] { 
      padding: 12px; font-size: 22px; border-radius: 10px; 
      border: 2px solid #2563eb; width: 70%; text-align: center; margin-bottom: 15px; 
      outline: none;
    }
    input[type="text"]:disabled {
      background-color: #f1f5f9;
      color: #475569;
    }

    #result { 
      font-size: 24px; margin-top: 20px; color: #1e293b; 
      background: #fff; padding: 30px 20px; border-radius: 20px; 
      border: 4px solid #1d4ed8;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    #feedback { min-height: 40px; margin-top: 20px; font-size: 24px; font-weight: bold; }

    #footer {
      position: fixed; bottom: 10px; left: 0; width: 100%;
      text-align: center; font-size: 13px; color: #64748b; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 시작 화면 -->
    <div id="name-input-area" class="input-box">
      <div class="badge">삼육중앙교회 소년반</div>
      <h2 style="margin: 5px 0 10px;">제9과 성경 퀴즈</h2>
      <p style="font-size: 19px; color: #dbeafe; margin-top: 0;">하나님께 영광을 돌림 (느헤미야 13장)</p>
      <p style="font-size: 20px;">이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 김진서" />
      <br>
      <button id="start-btn" style="background-color: #fbbf24; color: #1e3a8a; box-shadow: 0 3px 0 #d97706;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 화면 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: bold; color: #1e40af; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">삼육중앙교회 소년반 | 9과 하나님께 영광을 돌림</div>

  <script>
    'use strict';

    // 9과(하나님께 영광을 돌림, 느헤미야 13:1~22) 핵심 내용 기반 퀴즈 데이터
    const questions = [
      { 
        type: 'fill', 
        question: '기억절 빈칸 채우기:\n"너희는 여호와께 (   )하며 그 이름을 불러 아뢰며 그 행사를 만민 중에 알게 할지어다" (역대상 16:8)', 
        answer: '감사',
        comment: '맞아요! 하나님께서 우리를 위해 행하신 놀라운 일들을 기억하며 감사하고 찬양해야 해요!' 
      },
      { 
        type: 'ox',   
        question: '느헤미야는 12년 동안 유다의 총독으로 일하면서 백성들에게 많은 세금과 음식을 거두어 부자가 되었어요.', 
        answer: 'X',
        comment: '느헤미야는 12년 동안 총독으로 일하면서 작업의 대가로 단 한 푼의 은이나 음식도 받지 않고 헌신했어요!' 
      }, 
      { 
        type: 'mcq',  
        question: '느헤미야가 페르시아 왕에게 돌아간 사이, 대제사장 엘리아십은 성전의 십일조와 헌물 창고 방을 누구에게 내주었나요?', 
        options: ['A. 아닥사스다 왕', 'B. 성벽 재건을 방해했던 원수 도비야', 'C. 레위인 음악가들', 'D. 안식일 상인들'], 
        answer: 'B. 성벽 재건을 방해했던 원수 도비야',
        comment: '엘리아십은 하나님의 성전 방을 원수 도비야에게 내주는 큰 잘못을 저질렀고, 돌아온 느헤미야는 도비야의 물건을 모두 밖으로 던져버렸어요!' 
      },
      { 
        type: 'mcq',  
        question: '백성들이 십일조를 내지 않아 성전에서 일하던 레위인들과 음악 하는 사람들은 어떻게 되었나요?', 
        options: ['A. 페르시아로 떠났다', 'B. 성전 문을 닫아버렸다', 'C. 먹고살기 위해 농사지으러 밭으로 돌아갔다', 'D. 왕에게 편지를 썼다'], 
        answer: 'C. 먹고살기 위해 농사지으러 밭으로 돌아갔다',
        comment: '백성들이 십일조를 드리지 않아 생활이 어려워진 레위인들이 성전 일을 멈추고 농사지으러 돌아갔었어요. 느헤미야가 이들을 다시 불러 모았답니다!' 
      },
      { 
        type: 'short',
        question: '느헤미야가 예루살렘에 돌아와 보니 백성들이 곡식과 포도주, 물고기를 사고팔며 무너뜨리고 있던 거룩한 날은 무슨 날인가요? (3글자)', 
        answer: '안식일', 
        comment: '백성들이 거룩한 안식일에 물건을 사고팔며 일하는 것을 본 느헤미야는 금요일 해가 지기 전부터 성문을 굳게 닫게 했어요!' 
      },
      { 
        type: 'ox',   
        question: '느헤미야는 안식일을 거룩하게 지키기 위해 금요일 일몰이 시작되기 전부터 안식일이 끝날 때까지 예루살렘 성문을 닫고 지키게 했어요.', 
        answer: 'O',
        comment: '정확해요! 성문 밖에서 밤을 새우며 기다리던 상인들에게도 단호히 경고하여 안식일을 온전히 지킬 수 있도록 했답니다.' 
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    let isAnswered = false; // 중복 채점 방지 플래그
    const themes = ['#1d4ed8', '#0369a1', '#0f766e', '#1e40af', '#4338ca', '#b45309'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { alert("이름을 꼭 알려주세요!"); return; }
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      isAnswered = false; // 새 문제가 나올 때마다 초기화
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
      questionTextEl.innerHTML = q.question.replace(/\n/g, '<br>');
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O', false); 
        createBtn('X', false);
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt, true));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '정답을 적어보세요';
        answerAreaEl.appendChild(input);
        answerAreaEl.appendChild(document.createElement('br'));
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '정답 확인';
        submitBtn.style.backgroundColor = '#1d4ed8';
        submitBtn.style.color = '#fff';
        submitBtn.onclick = () => checkAnswer(input.value);
        answerAreaEl.appendChild(submitBtn);
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text, isMcq) {
      const btn = document.createElement('button');
      btn.textContent = text;
      if (isMcq) btn.className = 'mcq-btn';
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if (isAnswered) return; // 이미 채점된 문제라면 즉시 종료 (연타 방지)
      isAnswered = true;

      // 채점 즉시 기존 버튼 및 입력창 비활성화
      answerAreaEl.querySelectorAll('button, input').forEach(el => el.disabled = true);

      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short') {
        isCorrect = normalize(userAns).includes(normalize(q.answer));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:#1d4ed8;'>정답이에요! 정말 잘했어요! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:#dc2626;'>아쉬워요! 정답은 [${q.answer}] 입니다. ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '18px';
      commentDiv.style.color = '#334155';
      commentDiv.style.marginTop = '12px';
      commentDiv.style.lineHeight = '1.5';
      commentDiv.style.background = '#fff';
      commentDiv.style.padding = '15px';
      commentDiv.style.borderRadius = '12px';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 보기 🏆' : '다음 문제 ▶';
      nextBtn.style.backgroundColor = '#fbbf24';
      nextBtn.style.color = '#1e3a8a';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length 
        ? "와우! 만점이에요! 하나님께 영광을 돌리는 멋진 소년반 어린이네요!" 
        : "정말 수고했어요! 이번 주도 안식일을 거룩하게 지키며 하나님을 찬양해요!";
      resultEl.innerHTML = `
        <h2 style="color:#1e3a8a;">참 잘했어요, ${participantName} 어린이!</h2>
        <div style="font-size: 60px; margin: 15px 0;">👑</div>
        <p style="margin: 5px 0;">9과 성경 퀴즈 점수는</p>
        <p style="margin: 10px 0;"><span style="color:#1d4ed8; font-size:46px; font-weight:bold;">${score} / ${questions.length}</span></p>
        <p style="font-size: 19px; line-height: 1.5; color: #334155;">${message}</p>
        <button onclick="location.reload()" style="background-color:#1d4ed8; color:#fff; margin-top:15px;">한 번 더 풀기 🔄</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
