<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (13과 - 하나님의 이끄심)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #fdf6ec; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #2d3748;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #6d4c41; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f8fafc; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #cbd5e1; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #8d6e63;
      box-shadow: 0 0 0 3px rgba(141, 110, 99, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fca5a5;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #a8a29e; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🌾 소년반 성경퀴즈 13과</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"하나님의 이끄심"<br>이름을 입력하고 퀴즈를 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 룻" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #4e342e; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #78716c; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 13과: 하나님의 이끄심 (룻기 1:1~18 / 이사야 41:9 / 룻기 1:16)
      const questions = [
        // 1번: OX 문제 (본문의 핵심 사실 및 교훈 확인)
        { 
          type: 'ox',   
          question: '시어머니 나오미는 동방의 관습상 두 며느리를 평생 곁에 두고 부릴 수 있는 권리가 있었지만, 며느리들의 미래와 행복을 위해 고향 친정으로 돌아가 새 가정을 꾸리도록 배려하였다.', 
          answer: 'O' 
        }, 
        // [근거: PDF 96~97쪽] "동방의 오랜 관습에 따르면 시어머니인 나오미는 두 며느리를 평생 자신의 몸종처럼 곁에 두고 부릴 수 있는 권리가 있었습니다. 하지만 나오미는 오직 며느리들의 미래만을 생각하는 사리분별이 바르고 사랑이 많은 어머니였습니다... 너희 고향집과 친정가족들에게로 돌아가는 것이 최선의 길인 것 같구나."

        // 2번: 기억절 문제 (룻기 1:16 빈칸 채우기)
        { 
          type: 'fill', 
          question: '기억절: "어머니의 백성이 나의 백성이 되고 어머니의 하나님이 나의 (      )이/가 되시리니" (룻기 1:16)', 
          answer: '하나님' 
        },
        // [근거: PDF 95, 98쪽] "어머니의 백성이 나의 백성이 되고 어머니의 하나님이 나의 하나님이 되시리니"

        // 3번: 4지 선다형 (본문 세부 인물 확인)
        { 
          type: 'mcq',  
          question: '나오미의 진심 어린 권유를 듣고 눈물을 흘리며 작별의 입맞춤을 나눈 뒤, 자신의 친정과 고향 모압으로 돌아간 며느리는 누구인가요?', 
          options: [
            'A. 룻', 
            'B. 오르바', 
            'C. 라합', 
            'D. 한나'
          ], 
          answer: 'B. 오르바' 
        },
        // [근거: PDF 98쪽] "오르바는 나오미에게 감사의 작별 입맞춤을 하고 슬픈 마음으로 자신의 짐을 챙겼습니다. 그리고 왔던 길을 되돌아 고향으로 향했지요."

        // 4번: 4지 선다형 (본문 세부 지명 확인)
        { 
          type: 'mcq',  
          question: '나오미와 룻이 모압 땅을 떠나 끝까지 서로 의지하며 도착한 나오미의 고향 도시는 어디인가요?', 
          options: [
            'A. 베들레헴', 
            'B. 여리고', 
            'C. 가자', 
            'D. 다메섹'
          ], 
          answer: 'A. 베들레헴' 
        },
        // [근거: PDF 99쪽] "룻과 나오미는 서로를 향한 사랑과 하나님을 향한 굳건한 믿음을 가슴에 품은 채, 고향 베들레헴을 향해 다정하게 발걸음을 옮겼습니다."

        // 5번: 단답형 (핵심 키워드 확인)
        { 
          type: 'short',
          question: '유다 땅에 극심한 가뭄과 기근이 들었을 때, 나오미의 가족이 요단강을 건너 이사했던 이방 땅의 이름은 어디인가요? (2글자)', 
          answer: '모압' 
        },
        // [근거: PDF 95쪽] "고향 땅의 극심한 기근을 피해 남편 엘리멜렉과 두 아들을 데리고 요단강을 건너 이방 땅인 모압으로 이사 온 지 벌써 여러 해가 지났지만..."

        // 6번: 느낀점 (type: 'any')
        { 
          type: 'any',  
          question: '이방 여인이었던 룻은 미래가 불확실한 상황에서도 시어머니 나오미가 믿는 하나님을 온전히 나의 하나님으로 신뢰하며 결단했습니다. 여러분도 삶 속에서 "하나님은 나의 하나님이십니다"라고 고백하며 따르고 싶은 다짐이나 생각을 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 13과 나오미와 룻의 따뜻한 사랑과 헌신을 상징하는 품격 있는 가을/들판 브라운 테마
      const themes = ['#6D4C41', '#5D4037', '#795548', '#8D6E63', '#4E342E', '#3E2723'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          // 단답형, 빈칸채우기, 자유 서술형 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#4e342e';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 모압 땅, 모압지방 등 유연한 정답 인정
          if (nAns === '모압' && (nUser === '모압' || nUser === '모압땅' || nUser === '모압지방')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #15803d;'>따뜻하고 진심 어린 고백을 적어주어서 고마워요! 🌟</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #15803d;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #b91c1c;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 기존 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 진행 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#4e342e';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "어떤 슬픔과 불확실한 미래 앞에서도 우리를 변함없이 사랑으로 이끄시는 하나님을 신뢰하는 멋진 친구가 되길 축복해요! 🌾✨";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 룻처럼 흔들리지 않는 굳건한 믿음을 가진 소년반 최고 성경 박사님이에요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">13과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#b45309; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#57534e; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#78350f; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
