<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (2과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #e6f7ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #2D7D9A; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #Bce3e6; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 2과</h2>
      <p style="font-size: 20px; color: #eef;">주제: 생수 (요한복음 4장)</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 서우" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #333; margin-bottom: 10px; font-weight: bold;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 2과 생수 문제 데이터
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '예수님이 살던 시대에 유대인들과 사마리아인들은 서로를 무척 아끼며 자주 만나서 다정하게 대화를 나누었습니다.', 
          answer: 'X' 
        }, 
        // [근거] "유대인들과 사마리아인들은 서로 좋아하지 않았어요. 심지어는 서로 말도 하지 않았어요."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "내가 주는 (    )을 마시는 자는 영원히 목마르지 아니하리니" (요한복음 4:14)', 
          answer: '물' 
        },
        // [근거] 기억절 카드: "내가 주는 물을 마시는 자는..."

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님께서 지나가시던 중, 지치고 목이 마르셔서 앉아 쉬셨던 우물의 이름은 무엇인가요?', 
          options: ['A. 아브라함의 우물', 'B. 이삭의 우물', 'C. 야곱의 우물', 'D. 다윗의 우물'], 
          answer: 'C. 야곱의 우물' 
        },
        // [근거] "야곱의 우물이라고 불리는 이곳은 대개 사람들이 많았어요."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님을 만난 사마리아 여인은 영원히 목마르지 않는 생수에 대한 말씀을 믿고 어떻게 행동했나요?', 
          options: [
            'A. 우물에 물동이를 던져버리고 도망쳤다', 
            'B. 재빨리 마을로 달려가 사람들에게 놀라운 기별을 전했다', 
            'C. 유대인과는 친구가 될 수 없다고 화를 냈다', 
            'D. 아무에게도 말하지 않고 혼자서만 비밀로 간직했다'
          ], 
          answer: 'B. 재빨리 마을로 달려가 사람들에게 놀라운 기별을 전했다'
        },
        // [근거] "재빨리 그녀는 마을로 달려갔어요. '어서 오세요! 아주 놀라운 기별을 가진 사람을 여러분도 만나보세요!'"

        // 5번: 단답형
        { 
          type: 'short',
          question: '이번 2과의 중심 생각에서 배운 것처럼, 우리의 겉모습이나 종교, 환경이 다를지라도 예수님은 모든 사람의 "이것"이 되어 주십니다. 2글자인 "이것"은 무엇일까요?', 
          answer: '친구' 
        },
        // [근거] 중심생각: "예수님은 모든 사람의 친구가 되세요."

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '예수님은 편견 없이 모든 사람의 친구가 되어 주셨어요. 내 주변에 아직 친해지지 못했거나 조금 어색해 보이는 친구에게 어떻게 먼저 다가가 좋은 친구가 될 수 있을지 여러분의 생각을 자유롭게 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#2D7D9A', '#3C948B', '#489AAB', '#1F5E73']; // 물과 우물 느낌의 블루/민트 테마

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면(다음 버튼이 있으면) 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 내용이 있으면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          
          // 2번 기억절 보완: '물'이 정답이지만, 아이들이 흐름상 '생수'를 적었을 때도 정답 처리되도록 유연하게 설정
          if (q.type === 'fill' && nAns === '물' && (nUser === '물' || nUser === '생수')) {
            isCorrect = true;
          } else {
            isCorrect = nUser === nAns;
          }
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "#006622";
          score++;
        } else {
          feedbackEl.textContent = `아쉬워요! ❌ (정답: ${q.answer})`;
          feedbackEl.style.color = "#cc0000";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        // 6번 느낀점은 무조건 정답(내용 입력 시 통과) 처리되므로, 만점 점수에 반영됩니다.
        resultEl.innerHTML = `
          <h3>${participantName} 어린이,<br>
          오늘 2과 성경 퀴즈 ${questions.length}문제 중<br>
          <span style="color:#2D7D9A; font-size:40px;">${score}</span>문제를 완료했어요!</h3>
          <p>예수님처럼 멋진 친구가 되어보아요! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
