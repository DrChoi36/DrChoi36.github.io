<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (5과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #fefcf3; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #1e293b;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #ea580c; 
      box-shadow: 0 10px 25px rgba(234, 88, 12, 0.25); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #fff7ed; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #fed7aa; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 22px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fee2e2;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #78716c; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 화면 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🔥 소년반 성경퀴즈 5과 🛞</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"하나님과 함께 달리기"<br>이름을 입력하고 우리를 다시 일으켜 세우시는 하나님을 만나보세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #ea580c; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 문제 화면 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #78716c; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 5과 퀴즈 데이터 (열왕기상 19장, 열왕기하 2장, 마태복음 17장)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '엘리야는 다시 사명을 받아 돌아간 뒤, 사무엘 선지자가 세웠던 "선지자 학교" 세 곳을 재건하고 엘리사를 후계자로 세웠다.', 
          answer: 'O' 
        }, 
        // [근거: 교재 40쪽] "학교 세 곳을 재건하는 것도 엘리야가 한 특별한 일이었습니다. 그 학교는 '선지자 학교'라고 불렸습니다. 오래 전에 사무엘 선지자가... 또한 엘리사가 뒤를 이어 엘리야의 일을 맡을 수 있도록 훈련하라고 말씀하셨습니다."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "여호와께서 사람의 걸음을 정하시고 그의 길을 기뻐하시나니 그는 넘어지나 아주 엎드러지지 아니함은 여호와께서 그의 손으로 (      )이로다" (시편 37:23, 24)', 
          answer: '붙드심' 
        },
        // [근거: 교재 39쪽 기억절] "여호와께서 그의 손으로 붙드심이로다 (시편 37:23, 24)"

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '지상에서의 사명을 모두 마친 엘리야는 죽음을 맛보지 않고 하늘로 올라갔습니다. 이때 나타난 거대한 불덩어리 모습의 탈것은 무엇이었나요?', 
          options: [
            'A. 불마차 (불병거)', 
            'B. 불기둥', 
            'C. 불사다리', 
            'D. 불수레바퀴'
          ], 
          answer: 'A. 불마차 (불병거)' 
        },
        // [근거: 교재 39, 40쪽] "특별한 불병거를 타고 하늘로 올라갔습니다... 하늘에 거대한 불덩어리 모습을 한 마차가 내려와서 엘리야를 데려갔습니다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '변화산에서 예수님이 영광스러운 모습으로 변형되셨을 때, 하늘에서 내려와 예수님을 격려했던 두 사람은 누구였나요?', 
          options: [
            'A. 아브라함과 다윗', 
            'B. 모세와 엘리야', 
            'C. 노아와 다니엘', 
            'D. 여호수아와 갈렙'
          ], 
          answer: 'B. 모세와 엘리야' 
        },
        // [근거: 교재 41쪽] "하늘에서 모세와 함께 내려와 예수님을 격려했습니다. 엘리야는 죽지 않고 하늘로 올라갈 사람들을... 모세는 죽었지만 예수님께서 다시 오실 때 일어나 하늘로 올라갈 수 있는 사람들을 예수님께 상기시켜 주었습니다."

        // 5번: 단답형
        { 
          type: 'short',
          question: '엘리야의 뒤를 이어 사역을 이어받고, 함께 거닐다 엘리야가 불마차를 타고 승천하는 모습을 목격한 엘리야의 제자 선지자는 누구인가요?', 
          answer: '엘리사' 
        },
        // [근거: 교재 40쪽] "어느 날 엘리야와 엘리사가 함께 거닐고 있을 때 하늘에 거대한 불덩어리 모습을 한 마차가 내려와서..."

        // 6번: 느낀점 적기
        { 
          type: 'any',  
          question: '실수하고 도망쳤던 엘리야를 꾸짖지 않으시고 용서하시며 두 번째 기회를 주신 하나님처럼, 우리도 넘어졌을 때 나를 붙들어 주시는 하나님을 어떻게 의지하고 싶은지 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 불병거, 승천, 하나님의 회복과 은혜를 상징하는 선명하고 따뜻한 오렌지/레드/골드 테마
      const themes = ['#EA580C', '#C2410C', '#9A3412', '#B45309', '#D97706', '#7C2D12'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#ea580c';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 유연한 정답 인정 로직
          if (nAns === '붙드심' && (nUser.includes('붙드심') || nUser === '붙들다' || nUser === '붙들어주심')) {
            isCorrect = true;
          } else if (nAns === '엘리사' && (nUser === '엘리사' || nUser === '엘리사선지자')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #c2410c;'>우리의 실수를 용서하시고 다시 손잡아 주시는 하나님을 향한 훌륭한 고백입니다! 🔥🕊️✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #059669;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#ea580c';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "우리가 넘어질 때도 아주 엎드러지지 않도록 그분의 강한 손으로 붙들어 주시는 하나님의 사랑을 마음에 품는 소년반 친구가 되길 응원합니다! 🛞🔥";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 엘리야처럼 하나님과 함께 끝까지 믿음의 경주를 달릴 소년반 최고의 믿음 용사입니다! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">5과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#ea580c; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#ea580c; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
