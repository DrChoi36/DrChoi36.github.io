<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유년반 교과 퀴즈 (9과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&family=Gaegu:wght@400;700&display=swap');
    
    body { 
      margin: 0; padding: 0; 
      font-family: 'Gaegu', 'Comic Sans MS', sans-serif; 
      background: #f0f9ff; /* 9과 테마: 시원한 요단강 물결을 상징하는 하늘색 */
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; font-size: 24px;
      overflow-x: hidden;
    }

    #quiz-container { width: 95%; max-width: 600px; text-align: center; padding-bottom: 60px; }

    .question-box, .input-box { 
      padding: 30px; border-radius: 20px; color: #fff; 
      background-color: #2563eb; /* 푸른 요단강의 맑은 파란색 */
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
      line-height: 1.6;
      border: 4px solid #fff;
    }

    h2 {
      margin-top: 0;
      font-size: 36px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    button { 
      margin: 10px; padding: 15px 30px; font-size: 24px; 
      font-family: 'Gaegu', sans-serif;
      border: none; border-radius: 15px; cursor: pointer; 
      background-color: #fff; color: #1e3a8a; font-weight: bold;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.1s ease;
    }
    button:active { transform: translateY(4px); box-shadow: 0 1px 0 #cbd5e1; }
    button:hover { background-color: #f8fafc; color: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    input[type="text"] { 
      padding: 12px; font-size: 26px; border-radius: 12px; 
      border: 3px solid #2563eb; width: 80%; text-align: center; margin-bottom: 20px; 
      font-family: 'Gaegu', sans-serif;
      outline: none;
    }
    input[type="text"]:focus {
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }

    #result { 
      font-size: 28px; margin-top: 30px; color: #1e3a8a; 
      background: #fff; padding: 30px; border-radius: 25px; 
      border: 6px dashed #2563eb;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    #feedback { min-height: 40px; margin-top: 20px; font-size: 30px; font-weight: bold; }

    #footer {
      position: fixed; bottom: 10px; left: 0; width: 100%;
      text-align: center; font-size: 14px; color: #94a3b8; pointer-events: none;
    }

    /* 캐릭터 및 꾸미기 요소 */
    .emoji-deco {
      font-size: 50px;
      margin-bottom: 10px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <div class="emoji-deco">💧🕊️🌊</div>
      <h2>유년반 성경퀴즈 9과</h2>
      <p style="font-size: 22px; margin-top: -10px; color: #dbeafe;">옳은 선택 (예수님의 침례)</p>
      <p style="font-size: 20px;">예쁜 우리 어린이의 이름을 적고 시작해볼까요?</p>
      <input type="text" id="name-input" placeholder="이름을 적어주세요!" maxlength="10" />
      <br>
      <button id="start-btn">퀴즈 시작할래요! ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 22px; color: #1e40af; font-weight: bold; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 25px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi | 유년반 교과 9과</div>

  <script>
    'use strict';

    const questions = [
      { 
        type: 'ox',   
        question: '예수님께서는 지은 죄가 너무 많으셔서 죄를 깨끗하게 씻어내기 위해 침례를 받으셨어요.', 
        answer: 'X',
        comment: '맞았어요! 예수님은 죄가 하나도 없으시지만, 우리에게 아름다운 모본(따라 할 예쁜 본보기)을 보여주시기 위해 침례를 받으셨답니다.'
      }, 
      { 
        type: 'fill', 
        question: '기억절 빈칸을 채워보세요: "이는 내 사랑하는 (     )이요 내 기뻐하는 자라 하시니라" (마태복음 3:17)', 
        answer: '아들',
        comment: '정말 대단해요! 하늘에서 하나님 아버지께서 예수님을 향해 "사랑하는 아들"이라고 아주 기뻐하시며 말씀해주셨어요.'
      },
      { 
        type: 'mcq',  
        question: '예수님께서 침례 요한에게 침례를 받으셨던 아름다운 강의 이름은 무엇일까요?', 
        options: ['A. 한강', 'B. 나일강', 'C. 요단강', 'D. 낙동강'], 
        answer: 'C. 요단강',
        comment: '최고예요! 요단강의 맑은 물줄기 속에서 침례 요한이 예수님께 성스러운 침례를 베풀어 드렸어요.'
      },
      { 
        type: 'mcq',  
        question: '예수님이 침례를 받고 물 위로 올라오실 때, 성령 하나님께서는 어떤 모습으로 내려오셨나요?', 
        options: ['A. 하얀 비둘기 모습', 'B. 귀여운 어린양 모습', 'C. 힘센 독수리 모습', 'D. 반짝이는 천사 모습'], 
        answer: 'A. 하얀 비둘기 모습',
        comment: '우와! 하늘이 열리고 성령님께서 평화롭고 예쁜 하얀 비둘기 모습으로 예수님 위에 내려오셨어요.'
      },
      { 
        type: 'short',
        question: '침례 요한의 마음 준비 외침 낱말 카드 놀이예요! "회하개라 천이국 이까가 왔니느라"를 알맞게 합치면 "회개하라 (     )이 가까이 왔느니라"가 됩니다. 빈칸은 어디일까요? (2글자)', 
        answer: '천국', 
        comment: '우와! 요한은 "회개하라 천국이 가까이 왔느니라!"라고 외치며 사람들이 예수님을 영접할 수 있도록 마음의 준비를 도왔답니다.'
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    
    // 강물 테마의 푸른빛 그라데이션 색상 배치
    const themes = ['#2563eb', '#1d4ed8', '#1e40af', '#1e3a8a', '#1d4ed8'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { alert("우리 어린이의 이름을 꼭 알려주세요! ❤️"); return; }
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `⭐ 문제 ${current + 1} / ${questions.length} ⭐`;
      questionTextEl.textContent = q.question;
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O'); createBtn('X');
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '정답을 적어보세요!';
        answerAreaEl.appendChild(input);
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '정답 확인 🔍';
        submitBtn.onclick = () => checkAnswer(input.value);
        answerAreaEl.appendChild(submitBtn);
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text) {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if(answerAreaEl.querySelector('.next-btn')) return;
      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short') {
        isCorrect = normalize(userAns).includes(normalize(q.answer));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:#059669; font-size: 32px;'>우와! 정말 대단해요! 최고! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:#dc2626; font-size: 30px;'>정답은 [${q.answer}] 이에요! ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '20px';
      commentDiv.style.color = '#334155';
      commentDiv.style.marginTop = '12px';
      commentDiv.style.padding = '10px';
      commentDiv.style.background = '#f1f5f9';
      commentDiv.style.borderRadius = '12px';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하러 가기 🎉' : '다음 문제 풀러가기 ▶';
      nextBtn.style.backgroundColor = '#1e3a8a';
      nextBtn.style.color = '#fff';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(document.createElement('br'));
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length 
        ? "우와!! 완벽해요! 대단한 성경 퀴즈 박사님이시네요! 하나님의 자녀로서 언제나 옳은 선택을 해요! ❤️" 
        : "정말 수고했어요! 요단강에서 침례를 받으신 예수님을 마음속에 깊이 새기며, 우리도 예수님을 쏙 빼닮은 가족이 되기로 약속해요!";
      resultEl.innerHTML = `
        <h2>축하해요, 우리 ${participantName} 어린이!</h2>
        <div style="font-size: 80px; margin: 20px 0; animation: bounce 1.5s infinite;">🕊️🌊👑</div>
        <p style="font-size: 24px;">오늘 배운 제9과의 최종 점수는?</p>
        <p><span style="color:#2563eb; font-size:55px; font-weight: bold;">${score} / ${questions.length}</span></p>
        <p style="font-weight:bold; font-size: 22px; line-height: 1.6; color: #1e3a8a; padding: 0 10px;">${message}</p>
        <button style="background-color: #2563eb; color: #fff;" onclick="location.reload()">한 번 더 풀고 공부할래요! 🔄</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
