<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (11과 - 전쟁은 여호와께 달려 있다)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    /* 전체 화면 스타일링 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #eef2f6; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #2d3748;
    }

    /* 퀴즈 메인 컨테이너 */
    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    /* 질문 및 시작 카드 박스 */
    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #2B4C6F; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.14); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    /* 인터랙티브 버튼 디자인 */
    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f8fafc; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    /* 객관식 보기 버튼 (전체 폭) */
    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    /* 텍스트 입력창 스타일링 */
    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #cbd5e1; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* 결과창 및 정답 피드백 */
    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    /* 안내 경고 메시지 */
    .alert-msg {
      color: #f87171;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* 고정 푸터 */
    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #94a3b8; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">⚔️ 소년반 성경퀴즈 11과</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"전쟁은 여호와께 달려 있다"<br>이름을 입력하고 퀴즈를 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 요셉" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #f8fafc; color: #1e293b; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 11과: 전쟁은 여호와께 달려 있다 (여호수아 5:13~6:20 / 로마서 8:37)
      const questions = [
        // 1번: OX 문제 (사실 관계 및 핵심 규칙 확인)
        { 
          type: 'ox',   
          question: '이스라엘 백성들이 여리고 성 주위를 행군하는 6일 동안, 백성들은 아무 말도 하지 않고 침묵을 지켜야 했으며 오직 제사장들의 나팔 소리만 들려야 했다.', 
          answer: 'O' 
        }, 
        // [근거: PDF 82~84쪽] "행군하는 도중에는 단 한마디의 말도, 그 어떤 소리도 내서는 안 된다. 오직 제사장들의 나팔 소리만 들려야 한다"

        // 2번: 기억절 문제 (로마서 8:37 빈칸)
        { 
          type: 'fill', 
          question: '기억절: "그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 (     ) 이기느니라" (로마서 8:37)', 
          answer: '넉넉히' 
        },
        // [근거: PDF 81쪽] "우리를 사랑하시는 이로 말미암아 우리가 넉넉히 이기느니라"

        // 3번: 4지 선다형 (본문 핵심 등장인물 확인)
        { 
          type: 'mcq',  
          question: '여호수아가 여리고 성벽 앞에서 만난, 날카로운 칼을 빼들고 서 있던 분은 자신을 누구라고 밝혔나요?', 
          options: [
            'A. 애굽의 바로 왕', 
            'B. 여호와의 군대 장관 (대장)', 
            'C. 여리고 성의 수문장', 
            'D. 천사장 가브리엘'
          ], 
          answer: 'B. 여호와의 군대 장관 (대장)' 
        },
        // [근거: PDF 81쪽] "아니다. 나는 여호와의 군대 장관(대장)으로 지금 왔느니라."

        // 4번: 4지 선다형 (행군 세부 내용 확인)
        { 
          type: 'mcq',  
          question: '이스라엘 백성들은 마지막 일곱째 날에 여리고 성 주위를 총 몇 번 돌았나요?', 
          options: ['A. 1번', 'B. 3번', 'C. 7번', 'D. 12번'], 
          answer: 'C. 7번' 
        },
        // [근거: PDF 84쪽] "그날은 성을 무려 일곱 번이나 돌았습니다... 마침내 일곱 번째 행군을 마치는 바로 그 순간"

        // 5번: 단답형 (핵심 키워드)
        { 
          type: 'short',
          question: '하늘의 군대 대장이 여호수아에게 "네가 서 있는 이곳은 거룩한 곳이니라"라며 가장 먼저 발에서 무엇을 벗으라고 명령했나요? (1글자)', 
          answer: '신' 
        },
        // [근거: PDF 82쪽] "먼저 네 발에서 신을 벗어라. 네가 서 있는 이곳은 거룩한 곳이니라."

        // 6번: 느낀점 (type: 'any')
        { 
          type: 'any',  
          question: '단단하고 높은 여리고 성도 사람의 무기가 아니라 하나님을 향한 순종과 믿음으로 무너졌습니다. 내 힘으로 해결하기 어려운 문제가 생겼을 때, 하나님을 의지하며 어떻게 승리할 수 있을지 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 11과 '전쟁과 하나님의 승리' 테마에 맞는 깊이감 있는 세련된 색상 팔레트
      const themes = ['#2B4C6F', '#3A6B56', '#5C4378', '#A25927', '#43586C', '#28536B'];

      // HTML DOM 요소 참조
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          // 단답형, 빈칸채우기, 서술형 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#1e293b';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 5번 단답형 '신'의 경우 '신발'도 정답으로 유연하게 인정
          if (nAns === '신' && (nUser === '신' || nUser === '신발')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        // 결과 피드백 UI 업데이트
        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #16a34a;'>멋진 다짐을 적어주어서 고마워요! 🌟</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #16a34a;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 진행 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#1e293b';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "여리고 성벽을 무너뜨리신 하나님의 승리가 우리 친구의 삶에도 늘 함께하길 기도해요! 🛡️";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 하나님 안에서 승리하는 멋진 성경 박사님이에요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">11과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#e11d48; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#0284c7; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화: 띄어쓰기, 문장 부호, 특수기호 제거 및 소문자 통일
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
