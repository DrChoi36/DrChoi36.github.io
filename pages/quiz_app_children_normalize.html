<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (11과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', sans-serif; 
      background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 18px;
      color: #333;
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 20px 0; 
      padding-bottom: 80px; 
    }

    .question-box, .input-box { 
      padding: 35px 25px; 
      border-radius: 20px; 
      color: #fff; 
      background-color: #6B5B95; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: background-color 0.5s, transform 0.3s; 
    }

    .question-box:hover {
      transform: translateY(-2px);
    }

    /* 버튼 스타일 */
    button { 
      margin: 8px; 
      padding: 12px 24px; 
      font-size: 18px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f0f0f0; 
      transform: translateY(-1px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.12);
    }
    button:active {
      transform: translateY(1px);
    }
    button:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      transform: none;
      box-shadow: none;
    }

    /* 입력창 스타일 */
    input[type="text"], textarea { 
      padding: 12px; 
      font-size: 18px; 
      border-radius: 10px; 
      border: 2px solid #e2e8f0; 
      width: 80%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 15px; 
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #6B5B95;
    }

    textarea {
      width: 85%;
      height: 100px;
      resize: none;
      text-align: left;
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 20px; 
      margin-top: 30px; 
      color: #333; 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    #feedback { 
      min-height: 50px; 
      margin-top: 20px; 
      font-size: 18px; 
      font-weight: normal; 
      color: #fff; 
      background-color: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
      line-height: 1.5;
    }

    /* 에러 메시지 */
    .error-msg {
      color: #feb2b2;
      font-size: 15px;
      margin-top: -5px;
      margin-bottom: 10px;
      display: none;
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #888;
      pointer-events: none;
    }

    /* 애니메이션 효과 */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box fade-in">
      <h2>교과 퀴즈 11과</h2>
      <h3 style="font-weight: normal; color: #f3e8ff;">"계속 전도하기"</h3>
      <p>빛나는 사도 바울의 발자취를 따라 퀴즈를 풀어 보아요!<br>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 예수랑" maxlength="10" />
      <div id="name-error" class="error-msg">이름을 꼭 입력해 주세요! 😊</div>
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 영역 -->
    <div id="quiz-area" style="display:none;" class="fade-in">
      <div id="question-header" style="display: flex; justify-content: space-between; font-size: 15px; color: #4a5568; margin-bottom: 12px; font-weight: bold;">
        <span id="question-number"></span>
        <span id="user-display"></span>
      </div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 25px;"></div>
      <div id="feedback" style="display:none;"></div>
    </div>

    <!-- 결과 화면 영역 -->
    <div id="result" style="display:none;" class="fade-in"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 11과 문제 데이터
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '바울은 네로 황제의 잔인함 때문에 감옥에 갇혔을 때, 너무 힘들고 외로워서 하나님을 원망하고 전도하는 기도를 중단하였습니다.', 
          answer: 'X',
          rationale: '바울은 불결한 지하 감옥에 홀로 갇혔을 때도 결코 하나님을 원망하지 않았으며, 주님을 신뢰하고 끝까지 평안을 잃지 않았습니다.'
        }, 
        // 2번: 기억절 빈칸 단답형
        { 
          type: 'fill', 
          question: '기억절 빈칸 넣기:\n"두려워하지 말며 (      )하지 말고 말하라 내가 너와 함께 있으매" (사도행전 18:9, 10)', 
          answer: '침묵',
          rationale: '예수님께서는 바울에게 어려움이 닥쳐도 결코 "침묵"하지 말고 담대하게 주님의 은혜를 입을 열어 말하라고 격려하셨습니다.'
        },
        // 3번: 4지 선다형 (고난)
        { 
          type: 'mcq',  
          question: '바울이 복음을 전하면서 겪었던 수많은 어려움과 고단함들 중, 본문에 나오지 않는 상황은 무엇인가요?', 
          options: [
            'A. 유대인들에게 채찍을 다섯 번 맞고 세 번 매질을 당했다.', 
            'B. 배가 파선하여 바다에서 표류하는 고난을 겪었다.', 
            'C. 전도가 너무 안 되어 화가 나서 탈옥을 감행했다.', 
            'D. 시골과 도시, 심지어 거짓 형제들에게 위협을 받았다.'
          ], 
          answer: 'C. 전도가 너무 안 되어 화가 나서 탈옥을 감행했다.',
          rationale: '바울은 감옥 안에서도 결코 스스로 도망치거나 인간적인 분노를 드러내지 않았고, 오히려 감옥에 찾아오는 모든 이와 간수들에게 복음을 전했습니다.'
        },
        // 4번: 4지 선다형 (네로 앞)
        { 
          type: 'mcq',  
          question: '로마의 가장 잔인한 통치자였던 네로 황제 앞에서 자신을 변론할 때, 모든 사람이 바울을 떠났음에도 끝까지 그의 곁을 지키며 강건하게 하신 분은 누구인가요?', 
          options: [
            'A. 바울의 동료 베드로', 
            'B. 그를 사랑하셨던 주님(예수님)', 
            'C. 바울을 응원하던 로마 간수', 
            'D. 그를 변호해준 로마 변호사'
          ], 
          answer: 'B. 그를 사랑하셨던 주님(예수님)',
          rationale: '바울은 디모데에게 보낸 편지(딤후 4:17)에서 "주께서 내 곁에 서서 나를 강건하게 하심은 나로 말미암아 전도의 말씀이 온전히 전파되게 하려 하심"이라고 고백했습니다.'
        },
        // 5번: 단답형
        { 
          type: 'short',
          question: '이번 11과의 중심 생각은 "우리는 어디에 있든지 하나님의 (      )에 대해 말합니다" 입니다. 빈칸에 들어갈 두 글자의 정답은 무엇일까요?', 
          answer: '은혜',
          rationale: '바울은 악조건 속에서도 항상 자신을 용서하시고 인도해주신 하나님의 놀라운 "은혜"를 잊지 않고 늘 간증하며 외쳤습니다.'
        },
        // 6번: 느낀점 (any)
        { 
          type: 'any',  
          question: '바울처럼 힘든 상황에서도 하나님이 나와 늘 함께하심을 믿고, 내가 있는 학교나 학원, 가정 등에서 친구들에게 전할 수 있는 나의 사랑 가득한 실천 다짐(예: 힘든 친구를 따뜻하게 말로 위로하기, 나의 성경 이야기를 들려주기 등)을 자유롭게 적어 보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      // 따뜻하고 담대하며 믿음이 살아있는 느낌의 테마 색상들
      const themes = ['#4F46E5', '#7C3AED', '#DB2777', '#059669', '#D97706', '#0284C7']; 

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameError = document.getElementById('name-error');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const userDisplayEl = document.getElementById('user-display');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameError.style.display = 'block';
          nameInput.focus();
          return;
        }
        
        nameError.style.display = 'none';
        participantName = nameVal;
        
        // 화면 전환
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        userDisplayEl.textContent = `👤 ${participantName} 어린이`;
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.style.display = 'none';
        feedbackEl.innerHTML = ''; 
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `Q${current + 1} / ${questions.length}`;
        
        // 줄바꿈 반영
        questionTextEl.innerHTML = q.question.replace(/\n/g, '<br>');
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else if (q.type === 'any') {
          // 느낀점 적기
          const textarea = document.createElement('textarea');
          textarea.placeholder = '여기에 소중한 나의 생각을 적어 보세요... (비워 두지 않기!)';
          answerAreaEl.appendChild(textarea);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '생각 제출하기 ✔';
          submitBtn.style.backgroundColor = '#6B5B95';
          submitBtn.style.color = '#fff';
          submitBtn.addEventListener('click', () => checkAnswer(textarea.value));
          answerAreaEl.appendChild(submitBtn);
          
          textarea.focus();
        } else {
          // 주관식 단답 / 빈칸 채우기
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답을 입력하세요';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '정답 확인 ✔';
          submitBtn.style.backgroundColor = '#6B5B95';
          submitBtn.style.color = '#fff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 피드백이 떠 있으면 중단
        if(feedbackEl.style.display === 'block') return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교
        if (q.type === 'any') {
          isCorrect = userAns.trim().length >= 3; // 3글자 이상 정성스럽게 쓰면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 및 빈칸 넣기 정규화 비교 (공백 및 특수문자 무시)
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          isCorrect = (nUser === nAns);
        }

        // 결과 피드백 작성
        let feedbackHeader = '';
        if (q.type === 'any') {
          if (isCorrect) {
            feedbackHeader = "<span style='font-size: 22px; color: #a7f3d0;'>💭 정말 훌륭하고 귀한 생각이에요!</span>";
            score++;
          } else {
            feedbackHeader = "<span style='font-size: 20px; color: #fecaca;'>💡 조금 더 길게 나의 멋진 아이디어를 적어보세요!</span>";
          }
        } else {
          if (isCorrect) {
            feedbackHeader = "<span style='font-size: 22px; color: #a7f3d0;'>⭕ 정답입니다! 아주 잘했어요!</span>";
            score++;
          } else {
            let displayAns = q.answer;
            feedbackHeader = `<span style='font-size: 20px; color: #fecaca;'>❌ 아쉽지만 정답은 [ ${displayAns} ] 입니다.</span>`;
          }
        }

        // 해설 구문 추가
        let rationaleText = q.rationale ? `<div style='margin-top: 10px; font-size: 16px; color: #e2e8f0; font-weight: normal;'>💡 <b>말씀 해설:</b> ${q.rationale}</div>` : '';

        feedbackEl.innerHTML = `
          <div>${feedbackHeader}</div>
          ${rationaleText}
        `;
        feedbackEl.style.display = 'block';

        // 기존 답변 컨트롤 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input, textarea');
        inputs.forEach(el => el.disabled = true);

        // 다음으로 넘어가는 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '최종 결과 보기 🏁' : '다음 문제 넘어가기 ▶';
        nextBtn.style.backgroundColor = '#1e293b';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '15px';
        nextBtn.style.padding = '10px 20px';
        nextBtn.style.fontSize = '16px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(nextBtn);
      }

      // 최종 결과 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';

        let starMessage = '';
        let encourageMsg = '';
        
        // 맞춘 개수에 따른 맞춤형 격려 메시지
        if (score === questions.length) {
          starMessage = "⭐⭐⭐ 말씀 챔피언! ⭐⭐⭐";
          encourageMsg = "모든 퀴즈를 완벽하게 통과했어요! 바울처럼 하나님의 사랑의 복음을 누구에게나 용기 내어 전할 수 있는 준비된 멋진 소년이 되기를 진심으로 기도합니다!";
        } else if (score >= 4) {
          starMessage = "⭐⭐ 훌륭한 말씀 지킴이! ⭐⭐";
          encourageMsg = "대부분의 말씀 퀴즈를 잘 기억해 냈어요! 바울의 담대했던 사랑과 평화의 복음을 우리 삶 속에서 직접 보여주고 전하는 친구들이 되어 보아요.";
        } else {
          starMessage = "⭐ 말씀과 더 가까워질 시간! ⭐";
          encourageMsg = "괜찮아요! 성경 말씀을 다시 차근차근 복습하다 보면, 바울이 가졌던 굳건한 믿음을 여러분도 듬뿍 가질 수 있을 거예요! 화이팅!";
        }

        resultEl.innerHTML = `
          <h2 style="color: #6B5B95; margin-bottom: 5px;">${participantName} 어린이 수고했어요!</h2>
          <div style="font-size: 22px; font-weight: bold; margin: 15px 0; color: #1e3a8a;">
            11과 <계속 전도하기> 결과
          </div>
          <div style="font-size: 42px; font-weight: bold; color: #e11d48; margin-bottom: 10px;">
            ${score} / ${questions.length} 개 획득
          </div>
          <h3 style="color: #4f46e5; margin-bottom: 15px;">${starMessage}</h3>
          <p style="font-size: 16px; line-height: 1.6; color: #475569; word-break: keep-all; padding: 0 10px;">
            ${encourageMsg}
          </p>
          <hr style="border: 0; height: 1px; background: #e2e8f0; margin: 20px 0;">
          <button id="restart-btn" style="background-color: #6B5B95; color: #fff; padding: 12px 24px; font-size: 16px;">처음부터 다시 도전 🔄</button>
        `;

        document.getElementById('restart-btn').addEventListener('click', () => {
          current = 0;
          score = 0;
          resultEl.style.display = 'none';
          nameInputArea.style.display = 'block';
          nameInput.value = '';
          nameError.style.display = 'none';
        });
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거하여 관대한 채점 보장)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
