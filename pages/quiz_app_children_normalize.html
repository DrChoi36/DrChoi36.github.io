<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (7과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #f0f8ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #6B5B95; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 24px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
    }
    button:hover { background-color: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 10px; 
      font-size: 24px; 
      border-radius: 8px; 
      border: none; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 32px; 
      margin-top: 30px; 
      color: #333; 
      background: #F7CAC9; 
      padding: 20px; 
      border-radius: 12px; 
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
      color: #333; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>소년반 성경퀴즈 7과</h2>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 김철수" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    // 화면이 완전히 로딩된 후 코드를 실행하도록 설정 (오류 방지)
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 7과 문제 데이터 (나의 진정한 이웃)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '강도를 만나 쓰러진 사람을 보고 제사장과 레위인은 그를 불쌍히 여겨 정성껏 치료해 주었다.', 
          answer: 'X' 
        }, 
        // [근거: source 671, 672] "제사장은... 얼른 피했다. 레위 사람 역시... 얼른 지나갔다."

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "네 마음을 다하며... 주 너의 하나님을 사랑하고 또한 네 (   )을/를 네 자신 같이 사랑하라" (누가복음 10:27)', 
          answer: '이웃' 
        },
        // [근거: source 638] "...네 이웃을 네 자신 같이 사랑하라..."

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님의 이야기에서 강도 만난 사람을 보고 상처를 싸매주고 돌보아 준 사람은 누구인가요?', 
          options: ['A. 제사장', 'B. 레위인', 'C. 사마리아 사람', 'D. 율법사'], 
          answer: 'C. 사마리아 사람'
        },
        // [근거: source 673, 674] "사마리아 사람이... 상처를 싸매주고... 돌보아 주었다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '예수님께서는 누가 강도 만난 자의 이웃이냐고 물으신 후, 율법사에게 마지막으로 무엇이라고 말씀하셨나요?', 
          options: ['A. 성전에 가서 제사하라', 'B. 너도 이와 같이 하라', 'C. 율법을 더 연구하라', 'D. 고향으로 돌아가라'], 
          answer: 'B. 너도 이와 같이 하라'
        },
        // [근거: source 690] "너도 이와 같이 하라"

        // 5번: 단답형
        { 
          type: 'short',
          question: '어떤 사람이 예루살렘에서 (    )로 내려가다가 강도를 만났습니다. 빈칸에 들어갈 도시 이름은 무엇인가요?', 
          answer: '여리고' 
        },
        // [근거: source 669] "예루살렘에서 여리고로 가고 있었다."

        // 6번: 느낀점
        { 
          type: 'any',  
          question: '7과를 공부하며 내가 도와주어야 할 이웃은 누구인지, 어떻게 도와줄 수 있을지 적어보세요.' 
        }
      ];

      // 변수 설정
      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9']; // 문제 배경색

      // HTML 요소 가져오기
      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      // 시작 버튼 클릭 시 실행
      startBtn.addEventListener('click', startGame);
      
      // 엔터키 입력 시 실행
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      // 게임 시작 함수
      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 꼭 입력해주세요!");
          return;
        }
        
        participantName = nameVal;
        
        // 화면 전환: 이름 입력창 숨기고, 퀴즈 화면 보이기
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      // 문제 표시 함수
      function showQuestion() {
        feedbackEl.textContent = ''; // 피드백 초기화
        const q = questions[current];

        // 문제 번호 및 내용 표시
        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        // 답안 영역 초기화
        answerAreaEl.innerHTML = '';

        // 문제 타입에 따른 버튼/입력창 생성
        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else {
          // 주관식 입력창
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답 입력';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      // 버튼 생성 도우미 함수
      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      // 정답 확인 함수
      function checkAnswer(userAns) {
        // 이미 정답을 체크했으면(다음 버튼이 있으면) 중단
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        // 정답 비교 로직
        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0; // 내용이 있으면 정답
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          // 주관식 정규화 비교 (띄어쓰기, 특수문자 무시)
          isCorrect = normalize(userAns) === normalize(q.answer);
        }

        // 결과 피드백 및 점수
        if (isCorrect) {
          feedbackEl.textContent = "정답입니다! ⭕";
          feedbackEl.style.color = "yellow"; // 배경이 어두울 수 있으므로 밝은 색
          score++;
        } else {
          feedbackEl.textContent = "틀렸습니다! ❌";
          feedbackEl.style.color = "#ffcccc";
        }

        // 기존 버튼 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제';
        nextBtn.style.backgroundColor = '#333';
        nextBtn.style.color = '#fff';
        nextBtn.style.marginTop = '20px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      // 결과 화면 표시
      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>${participantName} 어린이는<br>
          총 ${questions.length}문제 중<br>
          <span style="color:red; font-size:40px;">${score}</span>개를 맞췄어요!</h3>
          <p>참 잘했어요! 👏👏👏</p>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
