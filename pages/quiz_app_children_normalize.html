<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (6과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nanum+Gothic:wght@700&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Nanum Gothic', 'Comic Sans MS', sans-serif; 
      background: #e8f5e9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 22px; 
      line-height: 1.5;
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0; 
      padding-bottom: 80px; 
    }

    .question-box, .input-box { 
      padding: 35px; 
      border-radius: 20px; 
      color: #fff; 
      background-color: #2e7d32; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: all 0.5s ease; 
      word-break: keep-all;
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 25px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #2e7d32; 
      font-weight: bold;
      box-shadow: 0 4px 0 #ccc;
    }
    button:hover { background-color: #f1f1f1; transform: translateY(-2px); }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"], textarea { 
      padding: 15px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #ddd; 
      width: 80%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
      outline: none;
    }
    textarea { height: 100px; text-align: left; width: 90%; }

    /* 결과 및 피드백 */
    #result { 
      font-size: 28px; 
      margin-top: 30px; 
      color: #333; 
      background: #ffffff; 
      padding: 40px; 
      border-radius: 20px; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    #feedback { 
      min-height: 50px; 
      margin-top: 25px; 
      font-size: 26px; 
      font-weight: bold; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #666;
      pointer-events: none;
    }

    .next-btn {
        background-color: #fbc02d !important;
        color: #333 !important;
        box-shadow: 0 4px 0 #f9a825 !important;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h1 style="margin-top:0;">📖 성경 퀴즈 6과</h1>
      <p style="font-size: 1.2em;">"너무 좋기에 나눠야 함"</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="이름을 적어주세요" />
      <br>
      <button id="start-btn">퀴즈 여행 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; color: #2e7d32; margin-bottom: 10px; font-weight: bold;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 25px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      const questions = [
        { 
          type: 'ox',   
          question: '바울과 바나바는 이고니온에 도착했을 때 가장 먼저 장터에서 설교를 시작했다.', 
          answer: 'X',
          comment: '그들은 먼저 유대인 회당으로 가서 설교를 시작했습니다.'
        }, 
        { 
          type: 'fill', 
          question: '기억절: "우리 하나님을 힘입어 많은 싸움 중에 하나님의 (        )을/를 너희에게 전하였노라" (데살로니가전서 2:2)', 
          answer: '복음' 
        },
        { 
          type: 'mcq',  
          question: '바울과 바나바가 안디옥에서 험한 산을 넘어 도착한 이 도시의 이름은 무엇인가요?', 
          options: ['A. 루스드라', 'B. 이고니온', 'C. 다메섹', 'D. 빌립보'], 
          answer: 'B. 이고니온' 
        },
        { 
          type: 'mcq',  
          question: '유대 지도자들이 바울과 바나바에게 분노한 결정적인 이유는 무엇이었나요?', 
          options: ['A. 옷차림이 남루해서', 'B. 말을 너무 잘해서', 'C. 하나님이 이적을 행하는 축복을 주셔서', 'D. 돈을 많이 모아서'], 
          answer: 'C. 하나님이 이적을 행하는 축복을 주셔서'
        },
        { 
          type: 'short',
          question: '바울과 바나바를 시기하여 소동을 일으키고 그들을 죽이려 했던 사람들을 무엇이라고 부르나요? (2글자)', 
          answer: '폭도' 
        },
        { 
          type: 'any',  
          question: '복음은 너무 좋아서 나만 가질 수 없어요. 여러분이 예수님의 사랑을 전해주고 싶은 친구나 이웃은 누구인가요? 그 이유도 간단히 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';
      const themes = ['#2E7D32', '#1565C0', '#6A1B9A', '#AD1457', '#EF6C00', '#37474F']; 

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          alert("이름을 입력해야 출발할 수 있어요!");
          return;
        }
        participantName = nameVal;
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.textContent = ''; 
        const q = questions[current];

        questionNumberEl.textContent = `STEP ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          createBtn('O');
          createBtn('X');
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => createBtn(opt));
        } else if (q.type === 'any') {
          const textarea = document.createElement('textarea');
          textarea.placeholder = '여기에 여러분의 생각을 적어주세요...';
          answerAreaEl.appendChild(textarea);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '나눔 완료';
          submitBtn.addEventListener('click', () => checkAnswer(textarea.value));
          answerAreaEl.appendChild(submitBtn);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = '정답을 입력하세요';
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkAnswer(input.value); });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
      }

      function checkAnswer(userAns) {
        if(answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 2; 
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);
          isCorrect = nUser === nAns;
        }

        if (isCorrect) {
          feedbackEl.innerHTML = "정답입니다! 참 잘했어요! 🌟";
          feedbackEl.style.color = "#2e7d32";
          score++;
        } else {
          if (q.type === 'any') {
            feedbackEl.innerHTML = "조금 더 정성껏 적어볼까요? (3자 이상)";
            feedbackEl.style.color = "#d32f2f";
            return; 
          }
          feedbackEl.innerHTML = `아쉬워요! 정답은 [ ${q.answer} ] 입니다. 💡`;
          feedbackEl.style.color = "#d32f2f";
        }

        const inputs = answerAreaEl.querySelectorAll('button, input, textarea');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '여행 결과 확인' : '다음 단계로';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let message = score === questions.length ? "복음의 전도사님! 완벽해요!" : "수고했어요! 복음을 나누는 어린이가 되어요!";
        
        resultEl.innerHTML = `
          <h2 style="color:#2e7d32;">🎊 퀴즈 여행 완료! 🎊</h2>
          <p><strong>${participantName}</strong> 어린이,</p>
          <p>오늘 ${questions.length}문제 중 <strong>${score}</strong>문제를 맞혔어요!</p>
          <div style="font-size: 40px; margin: 20px 0;">✨</div>
          <p style="font-weight:bold;">${message}</p>
          <button onclick="location.reload()">다시 하기</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
