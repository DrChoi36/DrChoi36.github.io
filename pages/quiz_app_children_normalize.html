<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (8과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #1e293b;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #1e3a8a; 
      box-shadow: 0 10px 25px rgba(30, 58, 138, 0.25); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #1e293b; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #eff6ff; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #bfdbfe; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 22px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fecaca;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #64748b; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 화면 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🛡️ 소년반 성경퀴즈 8과 🎺</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"하나님이 싸우심"<br>이름을 입력하고 기도와 경계로 성벽을 지켜낸 현장을 확인해 볼까요?</p>
      <input type="text" id="name-input" placeholder="예: 최재희" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #1e3a8a; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 문제 화면 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 8과 퀴즈 데이터 (느헤미야 4, 5장)
      const questions = [
        // 1번: OX 문제
        { 
          type: 'ox',   
          question: '느헤미야와 유다 백성들은 대적들의 공격 위협이 들려오자 성벽 재건을 완전히 멈추고 집으로 돌아가 숨어 지냈다.', 
          answer: 'X' 
        }, 
        // [근거: 교재 62, 65쪽] 기도와 경계(파수꾼 세우기, 한 손에 무기 들고 일하기)로 성벽 재건을 멈추지 않고 계속했습니다.

        // 2번: 기억절 문제
        { 
          type: 'fill', 
          question: '기억절: "우리의 대적이 우리가 그들의 의도를 눈치챘다 함을 들으니라 하나님이 그들의 꾀를 (         ) 우리가 다 성에 돌아와서 각각 일하였는데" (느헤미야 4:15)', 
          answer: '폐하셨으므로' 
        },
        // [근거: 교재 61쪽 기억절] "하나님이 그들의 꾀를 폐하셨으므로 (느헤미야 4:15)"

        // 3번: 4지 선다형
        { 
          type: 'mcq',  
          question: '유다 백성들이 쌓고 있는 성벽을 비웃으며 "여우가 올라가면 무너질 것"이라고 조롱한 대적은 누구였나요?', 
          options: [
            'A. 아닥사스다 왕', 
            'B. 도비야', 
            'C. 엘리아십', 
            'D. 하나니'
          ], 
          answer: 'B. 도비야' 
        },
        // [근거: 교재 61쪽] "이어서 도비야는 한 마리의 여우가 올라가면 성벽이 무너질 것이라고 말했다."

        // 4번: 4지 선다형
        { 
          type: 'mcq',  
          question: '대적들의 기습 공격에 대비하여 느헤미야와 일꾼들이 성벽을 지키고 건축한 방법으로 옳지 않은 것은 무엇인가요?', 
          options: [
            'A. 하나님께 기도하며 밤낮으로 파수꾼을 세웠다.', 
            'B. 도구를 나르는 자들은 한 손으로 일하고 다른 손에 무기를 잡았다.', 
            'C. 건축자들은 허리에 검을 차고 일했다.', 
            'D. 모든 공사를 중단하고 산속 동굴로 피신했다.'
          ], 
          answer: 'D. 모든 공사를 중단하고 산속 동굴로 피신했다.' 
        },
        // [근거: 교재 62, 65쪽] 기도하며 파수꾼을 세우고, 한 손에 일하고 한 손에 무기를 잡으며 허리에 검을 차고 건축했습니다.

        // 5번: 단답형
        { 
          type: 'short',
          question: '성벽의 다른 쪽 먼 곳에서 일하던 일꾼들이 대적의 공격을 알리는 "이 소리"를 들으면 즉시 그곳으로 모여들기로 약속했습니다. 느헤미야 곁에 늘 함께 있던 사람이 불었던 악기 소리는 무엇일까요? (2글자)', 
          answer: '나팔' 
        },
        // [근거: 교재 65쪽] "나는 나팔수와 항상 함께 있었다. 우리가 성벽 다른 쪽에 멀리 가 있을 때 일꾼들이 나팔 소리를 들으면 즉시 달려오도록 말해놓았다."

        // 6번: 느낀점 적기
        { 
          type: 'any',  
          question: '옳은 일을 할 때 누군가 나를 놀리거나 방해해서 포기하고 싶었던 적이 있나요? "하나님이 우리를 위해 싸우신다"고 외쳤던 느헤미야처럼, 하나님을 의지하며 이겨내고 싶은 나의 다짐을 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 하나님의 보호, 용기, 방패와 나팔 소리를 상징하는 네이비/슬레이트/크림슨 테마
      const themes = ['#1E3A8A', '#991B1B', '#0F766E', '#3730A3', '#B45309', '#334155'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#1e3a8a';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 띄어쓰기, 어미 변형 및 유사 정답 유연 처리
          if (nAns === '폐하셨으므로' && (nUser.includes('폐하셨') || nUser === '폐하심으로' || nUser === '무너뜨리셨으므로')) {
            isCorrect = true;
          } else if (nAns === '나팔' && (nUser === '나팔' || nUser === '나팔소리')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #1e3a8a;'>하나님이 우리를 위해 싸우심을 믿고 담대히 나아가는 멋진 다짐입니다! 🛡️✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #059669;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#1e3a8a';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "어떤 방해와 조롱 앞에서도 하나님이 싸워주심을 믿고 굳건히 서는 소년반 믿음의 용사가 되세요! 🛡️🎺";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 기도와 믿음으로 무장하여 하나님과 함께 승리하는 소년반 최고의 리더입니다! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">8과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#1e3a8a; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#1e3a8a; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
