<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (1과 - 너의 삶을 생각하라)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #f0fdf4; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #1e293b;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #0f766e; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #0f172a; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f8fafc; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #cbd5e1; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #1e293b; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #1e293b; 
    }

    .alert-msg {
      color: #fca5a5;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #94a3b8; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">💧 소년반 성경퀴즈 1과</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"너의 삶을 생각하라"<br>이름을 입력하고 퀴즈를 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 엘리야" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #115e59; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 1과: 너의 삶을 생각하라 (열왕기상 17:1~16)
      const questions = [
        // 1번: OX 문제 (본문의 핵심 교훈 및 사실 관계 확인)
        { 
          type: 'ox',   
          question: '사르밧 과부는 마지막 남은 한 움큼의 밀가루와 기름으로 엘리야 선지자를 위해 먼저 떡을 만들어 대접한 후, 가뭄이 끝날 때까지 밀가루와 기름이 떨어지지 않는 축복을 받았다.', 
          answer: 'O' 
        }, 
        // [근거: 본문 15쪽] "엘리야가 말했습니다. '두려워 말고 가서 먼저 그것으로 나를 위해 작은 떡 하나를 만들어 내게로 가져오고 그 후에 너와 네 아들을 위해 만들라...' 그 말은 그대로 실현되었습니다. 남은 삼년 동안 날마다 그 과부는 통의 밀가루와 병의 기름을 사용하여 빵을 만들었습니다."

        // 2번: 기억절 문제 (열왕기상 17:5 빈칸 채우기)
        { 
          type: 'fill', 
          question: '기억절: "그가 여호와의 말씀과 같이 하여 곧 가서 요단 앞 (      ) 시냇가에 머물매" (열왕기상 17:5)', 
          answer: '그릿' 
        },
        // [근거: 본문 11쪽 기억절] "그가 여호와의 말씀과 같이 하여 곧 가서 요단 앞 그릿 시냇가에 머물매(열왕기상 17:5)"

        // 3번: 4지 선다형 (본문 세부 내용 확인)
        { 
          type: 'mcq',  
          question: '엘리야가 그릿 시냇가에 머무는 동안, 아침과 저녁으로 빵과 음식을 날라다 준 하나님의 일꾼 동물은 무엇인가요?', 
          options: [
            'A. 까마귀', 
            'B. 비둘기', 
            'C. 독수리', 
            'D. 참새'
          ], 
          answer: 'A. 까마귀' 
        },
        // [근거: 본문 14쪽] "아침과 저녁으로 까마귀들이 빵을 물어다 주었습니다."

        // 4번: 4지 선다형 (본문 세부 내용 확인)
        { 
          type: 'mcq',  
          question: '엘리야가 하나님의 기별을 전하러 사마리아의 궁전으로 찾아가 "내 말이 없으면 수년 동안 비도 이슬도 있지 아니하리라"고 선포했던 이스라엘 왕은 누구인가요?', 
          options: [
            'A. 사울 왕', 
            'B. 아합 왕', 
            'C. 다윗 왕', 
            'D. 솔로몬 왕'
          ], 
          answer: 'B. 아합 왕' 
        },
        // [근거: 본문 11, 12쪽] "너는 나의 기별을 가지고 아합 왕에게 가거라... 놀란 아합 왕 앞에 섰습니다."

        // 5번: 단답형 (핵심 지명 맞히기)
        { 
          type: 'short',
          question: '그릿 시냇물이 완전히 말라버렸을 때, 하나님께서 엘리야에게 일어나 가라고 명하신 시돈에 속한 페니키아의 작은 마을 이름은 어디인가요? (3글자)', 
          answer: '사르밧' 
        },
        // [근거: 본문 14쪽] "하나님께서 '너는 일어나 시돈에 속한 사르밧으로 가서 거기 머물라.'고 하셨습니다."

        // 6번: 느낀점 (자유 서술형)
        { 
          type: 'any',  
          question: '가뭄 속에서도 엘리야와 사르밧 과부를 매일 돌보아 주신 하나님처럼, 하나님께서 여러분과 가족에게 날마다 베풀어 주시는 은혜에 대해 감사한 마음이나 다짐을 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 그릿 시냇가와 공급하시는 은혜를 상징하는 청록/딥그린/에메랄드 테마
      const themes = ['#0F766E', '#0D9488', '#047857', '#059669', '#15803D', '#115E59'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 감사의 다짐을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#115e59';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 사르밧 / 사르밧마을 등 유연한 정답 인정
          if (nAns === '사르밧' && (nUser === '사르밧' || nUser === '사르밧마을')) {
            isCorrect = true;
          } else if (nAns === '그릿' && (nUser === '그릿' || nUser === '그릿시냇가')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #15803d;'>매일 우리를 돌보시는 하나님께 대한 멋진 생각을 나누어주어 고마워요! 💧✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #15803d;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #b91c1c;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 기존 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 진행 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#115e59';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "가뭄 중에도 엘리야를 신실하게 먹이시고 돌보신 하나님처럼, 매일 우리를 이끄시는 하나님의 은혜를 신뢰하는 멋진 친구가 되길 축복해요! 🍞🕊️";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 엘리야처럼 굳건한 믿음으로 하나님을 의지하는 소년반 최고 성경 박사님이에요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">1과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#0f766e; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#115e59; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
