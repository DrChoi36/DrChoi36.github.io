<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유년반 성경 퀴즈 (12과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Comic+Neue:wght@700&display=swap');
    
    body { 
      margin: 0; padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', 'Nanum Pen Script', sans-serif; 
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); /* 신랑을 기다리는 밤하늘 테마 */
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; font-size: 22px; 
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* 별빛 배경 연출 */
    .stars {
      position: absolute; width: 100%; height: 100%;
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
      z-index: 1;
      opacity: 0.4;
    }

    #quiz-container { 
      position: relative;
      width: 90%; max-width: 600px; 
      text-align: center; 
      padding-bottom: 60px; 
      z-index: 10;
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 24px; 
      color: #fff; 
      background-color: rgba(30, 58, 138, 0.85); /* 깊은 밤하늘색 */
      box-shadow: 0 8px 32px rgba(251, 191, 36, 0.15); /* 은은한 등불 노란빛 광채 */
      border: 3px solid #fbbf24; /* 등불 노란색 테두리 */
      line-height: 1.6;
      backdrop-filter: blur(4px);
    }

    h2 {
      color: #fbbf24;
      font-size: 32px;
      margin-top: 10px;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    .subtitle {
      font-size: 20px;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    button { 
      margin: 10px; padding: 15px 25px; font-size: 20px; 
      border: none; border-radius: 16px; cursor: pointer; 
      background-color: #ffffff; color: #1e1b4b; font-weight: bold;
      box-shadow: 0 4px 0 #d1d5db;
      transition: all 0.2s ease;
    }
    button:active { transform: translateY(4px); box-shadow: none; }
    button:hover { background-color: #fef3c7; color: #78350f; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 다음 단계/결과보기 큰 버튼 전용 */
    .next-btn {
      background-color: #f59e0b !important;
      color: #ffffff !important;
      box-shadow: 0 4px 0 #b45309 !important;
    }
    .next-btn:hover {
      background-color: #fbbf24 !important;
    }

    input[type="text"] { 
      padding: 12px; font-size: 22px; border-radius: 14px; 
      border: 3px solid #fbbf24; width: 80%; text-align: center; 
      margin-bottom: 15px; 
      background-color: #f8fafc;
      color: #1e293b;
    }
    input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
    }

    .warning-msg {
      color: #f87171;
      font-size: 16px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
    }

    #result { 
      font-size: 24px; margin-top: 30px; color: #fff; 
      background: rgba(15, 23, 42, 0.9); padding: 30px; border-radius: 24px; 
      border: 5px solid #fbbf24;
      box-shadow: 0 10px 40px rgba(251, 191, 36, 0.3);
    }
    #feedback { min-height: 40px; margin-top: 20px; font-size: 26px; font-weight: bold; }

    #footer {
      position: fixed; bottom: 10px; left: 0; width: 100%;
      text-align: center; font-size: 14px; color: #64748b; pointer-events: none;
      z-index: 5;
    }

    /* 등불 아이콘 흔들리는 효과 */
    .lamp-icon {
      font-size: 45px;
      display: inline-block;
      animation: sway 3s ease-in-out infinite alternate;
      transform-origin: top center;
    }
    @keyframes sway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <div class="lamp-icon">🕯️</div>
      <h2>유년반 성경퀴즈 12과</h2>
      <div class="subtitle">준비가 되었나? (마태복음 25장)</div>
      <p style="font-size: 18px; color: #e2e8f0; line-height: 1.5;">
        "어두운 밤, 신랑을 기다리는 등잔의 기름을 든든하게 준비해 보아요! 이름은 무엇인가요?"
      </p>
      <input type="text" id="name-input" placeholder="이름을 적어주세요 (예: 은찬)" maxlength="10"/>
      <div id="name-warning" class="warning-msg">이름을 알려주시면 등불 퀴즈를 환하게 켤 수 있어요! 😊</div>
      <br>
      <button id="start-btn">등불 밝히고 시작하기 🕯️</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; color: #cbd5e1; margin-bottom: 10px; font-weight: bold;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi | 유년반 교과 12과</div>

  <script>
    'use strict';

    // 12과 '준비가 되었나?' 성경 내용에 딱 맞춘 5문제
    const questions = [
      { 
        type: 'ox',   
        question: '결혼식을 기다리던 열 명의 처녀들은 신랑이 늦게 오자 모두 졸려서 잠이 들었어요.', 
        answer: 'O',
        comment: '맞아요! 신랑이 생각보다 너무 늦게 와서 모든 처녀가 깜빡 잠이 들어 버렸답니다. ⏰'
      }, 
      { 
        type: 'fill', 
        question: '기억절: "그런즉 (      ) 있으라 너희는 그 날과 그 때를 알지 못하느니라" (마태복음 25:13)', 
        answer: '깨어',
        comment: '와, 정답이에요! 신랑이 언제 오더라도 맞이할 수 있도록 우리는 매일 믿음으로 "깨어" 있어야 해요. ✨'
      },
      { 
        type: 'mcq',  
        question: '등불을 오랫동안 켤 수 있도록 여분의 그릇에 기름을 미리 든든히 준비한 지혜로운 처녀는 몇 명이었나요?', 
        options: ['A. 2명', 'B. 5명', 'C. 7명', 'D. 10명'], 
        answer: 'B. 5명',
        comment: '정답이에요! 슬기로운 다섯 명의 처녀는 여분의 그릇에 기름을 잘 챙겨 두어 신랑을 잘 맞이할 수 있었어요! 🍯'
      },
      { 
        type: 'mcq',  
        question: '교과 공부 월요일 편에 의하면, 어두운 세상을 비추는 등불 안의 \'기름\'은 누구를 상징하나요?', 
        options: ['A. 성령 하나님', 'B. 맛있는 과일', 'C. 화려한 옷', 'D. 반짝이는 보석'], 
        answer: 'A. 성령 하나님',
        comment: '우와, 대단해요! 마음속 등불의 기름은 바로 우리를 기도의 자리로 이끄시는 성령 하나님을 상징한답니다. 🔥'
      },
      { 
        type: 'short',
        question: '기름을 미리 사놓지 못해 한밤중에 허둥지둥 기름을 사러 나갔던 처녀들이 돌아왔을 때, 이미 결혼식장의 문을 굳게 닫은 주인공은 누구였나요? (2글자)', 
        answer: '신랑', 
        comment: '맞아요! 신랑이 도착해 결혼식 문이 완전히 잠긴 후에는 들어갈 수 없었어요. 우리 모두 예수님을 미리 기쁘게 맞이할 준비를 해요! 👑'
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    // 테마색상: 조금씩 변하는 등불 밝기의 밤하늘 노란 그라데이션 광채 반영
    const themes = ['#1e3a8a', '#1e1b4b', '#2e1065', '#3b0764', '#0f172a'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const nameWarning = document.getElementById('name-warning');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { 
        nameWarning.style.display = 'block'; 
        return; 
      }
      nameWarning.style.display = 'none';
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `⭐ 문제 ${current + 1} / ${questions.length} ⭐`;
      questionTextEl.textContent = q.question;
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O'); createBtn('X');
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '예배당 정답을 적어보세요';
        answerAreaEl.appendChild(input);
        
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '정답 확인 ✔';
        submitBtn.className = 'next-btn';
        submitBtn.style.marginLeft = '10px';
        submitBtn.onclick = () => checkAnswer(input.value);
        answerAreaEl.appendChild(submitBtn);
        
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text) {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if(answerAreaEl.querySelector('.next-btn') && questions[current].type !== 'short' && questions[current].type !== 'fill') return;
      if(feedbackEl.textContent !== '') return; // 이미 답을 체크했으면 중복 실행 방지
      
      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short') {
        isCorrect = normalize(userAns).includes(normalize(q.answer));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:#fbbf24; text-shadow: 0 0 8px rgba(251,191,36,0.5);'>우와! 정말 대단해요! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:#f87171;'>조금 아쉬워요! 정답은 [${q.answer}] 입니다. ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '18px';
      commentDiv.style.color = '#cbd5e1';
      commentDiv.style.marginTop = '12px';
      commentDiv.style.lineHeight = '1.5';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하러 가기 🏆' : '다음 등불 밝히기 ▶';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(document.createElement('br'));
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length 
        ? "대단해요! 등불을 환하게 밝힌 최고의 성경 박사님이군요! 🌟" 
        : "예수님을 사랑하는 예쁜 마음이 가득해요! 다음 교과도 즐겁게 공부해요! 🙌";
      
      resultEl.innerHTML = `
        <h2>축하해요, ${participantName} 어린이!</h2>
        <div class="lamp-icon" style="font-size: 70px; margin: 20px 0;">🕯️✨</div>
        <p>우리 어린이의 12과 성경 등불지수는</p>
        <p><span style="color:#fbbf24; font-size:50px; font-weight:bold;">${score} / ${questions.length}</span></p>
        <p style="font-weight:bold; font-size:20px; color:#e2e8f0; line-height: 1.6; padding:0 10px;">${message}</p>
        <button onclick="location.reload()" style="margin-top: 15px;">다시 기쁘게 도전하기 🔄</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
