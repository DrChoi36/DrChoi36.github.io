<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유년반 성경퀴즈: 오천 명을 먹이신 예수님</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    
    body { 
      margin: 0; padding: 0; 
      font-family: 'Jua', sans-serif; 
      background: #fffbeb; /* 따뜻한 빵 색깔 테마 */
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; font-size: 24px; 
    }

    #quiz-container { width: 90%; max-width: 600px; text-align: center; padding-bottom: 60px; }

    .question-box, .input-box { 
      padding: 30px; border-radius: 25px; color: #fff; 
      background-color: #f59e0b; /* 맛있는 오렌지색 */
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      line-height: 1.6;
    }

    button { 
      margin: 10px; padding: 15px 30px; font-size: 22px; 
      border: none; border-radius: 15px; cursor: pointer; 
      background-color: #fff; color: #d97706; font-weight: bold;
      box-shadow: 0 4px 0 #d97706;
      transition: transform 0.1s;
    }
    button:active { transform: translateY(3px); box-shadow: none; }
    button:hover { background-color: #fef3c7; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    input[type="text"] { 
      padding: 15px; font-size: 24px; border-radius: 15px; 
      border: 3px solid #f59e0b; width: 80%; text-align: center; margin-bottom: 20px; 
    }

    #result { 
      font-size: 28px; margin-top: 30px; color: #333; 
      background: #fff; padding: 40px; border-radius: 25px; 
      border: 5px dashed #f59e0b;
    }
    #feedback { min-height: 50px; margin-top: 25px; font-size: 26px; font-weight: bold; }

    #footer {
      position: fixed; bottom: 10px; left: 0; width: 100%;
      text-align: center; font-size: 14px; color: #92400e; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>🍞 오천 명을 먹이신 예수님</h2>
      <p style="font-size: 20px;">예수님의 놀라운 기적을 공부해요!</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 김사랑" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #92400e; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi | 유년반 성경퀴즈</div>

  <script>
    'use strict';

    const questions = [
      { 
        type: 'ox',   
        question: '예수님께서는 배고픈 사람들을 보시고 모른 척하지 않고, 그들에게 먹을 것을 주셨나요?', 
        answer: 'O',
        comment: '맞아요! 예수님은 우리를 정말 사랑하셔서 우리의 모든 필요를 아시고 채워주세요!'
      }, 
      { 
        type: 'fill', 
        question: '기억절: "예수님께서 말씀하셨어요. 너희가 먹을 것을 (   )!" (마태복음 14:16)', 
        answer: '주라',
        comment: '우리가 가진 것을 다른 사람과 나누는 것이 예수님의 마음이에요!'
      },
      { 
        type: 'mcq',  
        question: '안드레가 찾은 소년의 도시락에는 무엇이 들어있었나요?', 
        options: ['A. 빵 2개, 물고기 5마리', 'B. 빵 5개, 물고기 2마리', 'C. 사과 5개, 포도 2송이', 'D. 떡 12개'], 
        answer: 'B. 빵 5개, 물고기 2마리',
        comment: '소년이 드린 작은 도시락이 오천 명을 먹이는 큰 기적이 되었어요!'
      },
      { 
        type: 'mcq',  
        question: '사람들이 배불리 먹고 남은 음식을 모으니 몇 바구니가 되었나요?', 
        options: ['A. 3바구니', 'B. 5바구니', 'C. 7바구니', 'D. 12바구니'], 
        answer: 'D. 12바구니',
        comment: '하나님은 언제나 우리가 필요한 것보다 더 넘치게 채워주시는 분이에요!'
      },
      { 
        type: 'short',
        question: '어려운 사람을 돕는 것은 누구를 섬기는 것과 같을까요? (3글자)', 
        answer: '예수님', 
        comment: '우리가 친구를 도와줄 때, 예수님께서는 정말 기뻐하신답니다!'
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    const themes = ['#f59e0b', '#d97706', '#b45309', '#92400e', '#78350f'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { return; }
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
      questionTextEl.textContent = q.question;
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O'); createBtn('X');
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '정답을 적어보세요';
        answerAreaEl.appendChild(input);
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '정답 확인';
        submitBtn.onclick = () => checkAnswer(input.value);
        answerAreaEl.appendChild(submitBtn);
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text) {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if(answerAreaEl.querySelector('.next-btn')) return;
      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short' || q.type === 'fill') {
        isCorrect = normalize(userAns).includes(normalize(q.answer));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:#059669;'>참 잘했어요! 정답이에요! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:#dc2626;'>아쉬워요! 정답은 [${q.answer}] 입니다. ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '20px';
      commentDiv.style.color = '#334155';
      commentDiv.style.marginTop = '15px';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 보기' : '다음 문제 ▶';
      nextBtn.style.backgroundColor = '#f59e0b';
      nextBtn.style.color = '#fff';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(document.createElement('br'));
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length ? "최고예요! 성경 박사님이군요!" : "정말 수고했어요! 다음에도 또 만나요!";
      resultEl.innerHTML = `
        <h2>축하해요, ${participantName} 어린이!</h2>
        <div style="font-size: 60px; margin: 15px 0;">🎁</div>
        <p>우리 어린이의 점수는</p>
        <p><span style="color:#d97706; font-size:45px; font-weight:bold;">${score} / ${questions.length}</span></p>
        <p style="font-weight:bold;">${message}</p>
        <button onclick="location.reload()">한 번 더 풀기</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
