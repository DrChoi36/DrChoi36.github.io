<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소년반 성경 퀴즈 (3과 - 지켜진 약속)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Noto Sans KR', 'Comic Neue', sans-serif; 
      background: #f0f9ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 20px; 
      color: #0f172a;
    }

    #quiz-container { 
      width: 92%; 
      max-width: 650px; 
      text-align: center; 
      padding: 20px 0 70px 0; 
    }

    .question-box, .input-box { 
      padding: 32px 24px; 
      border-radius: 20px; 
      color: #ffffff; 
      background-color: #0284c7; 
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.2); 
      transition: background-color 0.4s ease, transform 0.2s ease; 
      line-height: 1.6;
    }

    .question-box {
      font-size: 22px;
      font-weight: 700;
      word-break: keep-all;
    }

    button { 
      margin: 8px 6px; 
      padding: 14px 26px; 
      font-size: 20px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #ffffff; 
      color: #0f172a; 
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    button:hover { 
      background-color: #f8fafc; 
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled { 
      opacity: 0.65; 
      cursor: not-allowed; 
      transform: none;
    }

    .mcq-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px 20px;
    }

    input[type="text"] { 
      padding: 12px 18px; 
      font-size: 20px; 
      border-radius: 10px; 
      border: 2px solid #bae6fd; 
      width: 75%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
    }

    #result { 
      font-size: 24px; 
      margin-top: 20px; 
      color: #0f172a; 
      background: #ffffff; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      line-height: 1.7;
    }
    #feedback { 
      min-height: 48px; 
      margin-top: 20px; 
      font-size: 23px; 
      font-weight: 800; 
      color: #0f172a; 
    }

    .alert-msg {
      color: #fee2e2;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
    }

    #footer { 
      position: fixed; 
      bottom: 12px; 
      left: 0; 
      width: 100%; 
      text-align: center; 
      font-size: 14px; 
      color: #64748b; 
      font-weight: 600;
      pointer-events: none; 
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <!-- 이름 입력 영역 -->
    <div id="name-input-area" class="input-box">
      <h2 style="margin-top:0; font-size: 28px;">🌧️ 소년반 성경퀴즈 3과 ☁️</h2>
      <p style="font-size: 20px; opacity: 0.95; margin-bottom: 24px;">"지켜진 약속"<br>이름을 입력하고 약속을 지키시는 하나님의 은혜 퀴즈를 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 엘리야" autocomplete="off" />
      <div id="name-alert" class="alert-msg" style="display:none;">이름을 꼭 입력해 주세요!</div>
      <br>
      <button id="start-btn" style="background-color: #ffffff; color: #0369a1; padding: 14px 32px; font-size: 22px;">퀴즈 시작 ▶</button>
    </div>

    <!-- 퀴즈 진행 영역 -->
    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 12px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 24px;"></div>
      <div id="feedback"></div>
    </div>

    <!-- 최종 결과 표시 영역 -->
    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      'use strict';

      // 3과: 지켜진 약속 (열왕기상 18:41~46)
      const questions = [
        // 1번: OX 문제 (비 내리는 표징과 엘리야의 믿음)
        { 
          type: 'ox',   
          question: '엘리야는 하늘이 온통 먹구름으로 뒤덮이고 굵은 장대비가 쏟아질 때까지 기다린 후에야 비로소 아합 왕에게 마차를 준비하라고 알렸다.', 
          answer: 'X' 
        }, 
        // [근거: 본문 28쪽] "그는 하늘이 검은 구름으로 뒤덮일 때까지 기다리지 않았습니다. 빗줄기가 뿌리기 시작할 때까지 기다리지 않았습니다. 그는 작은 구름이 비가 내릴 하나님의 징조라고 인정했습니다."

        // 2번: 기억절 문제 (베드로후서 3:9 빈칸 채우기)
        { 
          type: 'fill', 
          question: '기억절: "주의 약속은 어떤 이들이 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 주께서는 너희를 대하여 오래 참으사 아무도 멸망하지 아니하고 다 (      )하기에 이르기를 원하시느니라" (베드로후서 3:9)', 
          answer: '회개' 
        },
        // [근거: 본문 25쪽 기억절] "다 회개하기에 이르기를 원하시느니라(베드로후서 3:9)"

        // 3번: 4지 선다형 (기도와 응답의 횟수)
        { 
          type: 'mcq',  
          question: '엘리야가 갈멜산 꼭대기에서 얼굴을 땅에 대고 비를 위해 간절히 기도했을 때, 하인이 바다에서 비의 징조인 구름을 발견한 것은 몇 번째로 바다를 살폈을 때였나요?', 
          options: [
            'A. 세 번째', 
            'B. 다섯 번째', 
            'C. 일곱 번째', 
            'D. 열 번째'
          ], 
          answer: 'C. 일곱 번째' 
        },
        // [근거: 본문 26쪽] "그런 다음 엘리야는 일곱 번째로 하인을 보냈습니다... 이번에는 사환이 놀라운 소식을 가지고 돌아왔습니다."

        // 4번: 4지 선다형 (비의 징조의 모양)
        { 
          type: 'mcq',  
          question: '일곱 번째로 바다를 살펴본 하인이 엘리야에게 달려와 전했던 구름의 크기는 어떤 모양이었나요?', 
          options: [
            'A. 사람의 얼굴만 한 구름', 
            'B. 사람의 손만 한 작은 구름', 
            'C. 하늘을 가득 채운 먹구름', 
            'D. 수레바퀴만 한 둥근 구름'
          ], 
          answer: 'B. 사람의 손만 한 작은 구름' 
        },
        // [근거: 본문 27쪽] "바다에서 사람의 손 만한 작은 구름이 일어나나이다(열왕기상 18:44)"

        // 5번: 단답형 (행선지 성읍 이름)
        { 
          type: 'short',
          question: '엘리야가 허리띠로 옷을 동이고 비바람 속에서 아합 왕의 마차 앞에서 달려 안전하게 인도해 주었던 약 45km 떨어진 도성의 이름은 어디인가요?', 
          answer: '이스르엘' 
        },
        // [근거: 본문 28쪽] "왕은 약 45km 떨어진 이스르엘 성으로 여행을 시작했습니다... 엘리야는 말고삐를 붙잡고 왕의 마차 앞에서 달려 아합을 안전하게 도성으로 인도했습니다."

        // 6번: 느낀점 (자유 서술형)
        { 
          type: 'any',  
          question: '기도하고 바로 응답이 보이지 않아도 여섯 번이나 포기하지 않고 일곱 번째까지 기도했던 엘리야처럼, 여러분은 응답이 더디게 느껴질 때 어떤 믿음으로 하나님께 계속 기도하고 싶은지 자유롭게 적어보세요.' 
        }
      ];

      let current = 0;
      let score = 0;
      let participantName = '';

      // 지중해 바다와 비구름, 신실한 언약의 푸른 하늘을 상징하는 블루/스카이/인디고 테마
      const themes = ['#0284C7', '#0369A1', '#0F766E', '#1D4ED8', '#2563EB', '#4338CA'];

      const nameInputArea = document.getElementById('name-input-area');
      const nameInput = document.getElementById('name-input');
      const nameAlert = document.getElementById('name-alert');
      const startBtn = document.getElementById('start-btn');
      const quizArea = document.getElementById('quiz-area');
      const questionNumberEl = document.getElementById('question-number');
      const questionTextEl = document.getElementById('question-text');
      const answerAreaEl = document.getElementById('answer-area');
      const feedbackEl = document.getElementById('feedback');
      const resultEl = document.getElementById('result');

      startBtn.addEventListener('click', startGame);
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
      });

      function startGame() {
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          nameAlert.style.display = 'block';
          nameInput.focus();
          return;
        }
        nameAlert.style.display = 'none';
        participantName = nameVal;
        
        nameInputArea.style.display = 'none';
        quizArea.style.display = 'block';
        
        showQuestion();
      }

      function showQuestion() {
        feedbackEl.innerHTML = '';
        const q = questions[current];

        questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
        questionTextEl.textContent = q.question;
        questionTextEl.style.backgroundColor = themes[current % themes.length];

        answerAreaEl.innerHTML = '';

        if (q.type === 'ox') {
          const btnO = createBtn('O');
          const btnX = createBtn('X');
          btnO.style.fontSize = '32px';
          btnX.style.fontSize = '32px';
          btnO.style.width = '120px';
          btnX.style.width = '120px';
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            const btn = createBtn(opt);
            btn.className = 'mcq-btn';
          });
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = q.type === 'any' ? '생각이나 결심을 자유롭게 적어보세요' : '정답 입력';
          if (q.type === 'any') {
            input.style.width = '88%';
            input.style.textAlign = 'left';
          }
          answerAreaEl.appendChild(input);
          
          const submitBtn = document.createElement('button');
          submitBtn.textContent = '제출하기';
          submitBtn.style.backgroundColor = '#0284c7';
          submitBtn.style.color = '#ffffff';
          submitBtn.addEventListener('click', () => checkAnswer(input.value));
          answerAreaEl.appendChild(document.createElement('br'));
          answerAreaEl.appendChild(submitBtn);

          input.focus();
          input.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkAnswer(input.value); 
          });
        }
      }

      function createBtn(text) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.addEventListener('click', () => checkAnswer(text));
        answerAreaEl.appendChild(btn);
        return btn;
      }

      function checkAnswer(userAns) {
        if (answerAreaEl.querySelector('.next-btn')) return;

        const q = questions[current];
        let isCorrect = false;

        if (q.type === 'any') {
          isCorrect = userAns.trim().length > 0;
        } else if (q.type === 'mcq') {
          isCorrect = (userAns === q.answer);
        } else {
          let nUser = normalize(userAns);
          let nAns = normalize(q.answer);

          // 이스르엘 / 이스르엘성 등 유연한 정답 허용
          if (nAns === '이스르엘' && (nUser === '이스르엘' || nUser === '이스르엘성' || nUser === '이스르엘도성')) {
            isCorrect = true;
          } else if (nAns === '회개' && (nUser === '회개' || nUser === '회개함' || nUser === '회개하기')) {
            isCorrect = true;
          } else {
            isCorrect = (nUser === nAns);
          }
        }

        if (q.type === 'any') {
          feedbackEl.innerHTML = "<span style='color: #0369a1;'>포기하지 않고 끝까지 신뢰하며 기도하겠다는 멋진 결심을 나누어주어 고마워요! 🌧️🙏✨</span>";
          score++;
        } else if (isCorrect) {
          feedbackEl.innerHTML = "<span style='color: #059669;'>정답입니다! ⭕</span>";
          score++;
        } else {
          let correctHint = (q.type === 'ox' || q.type === 'mcq') ? q.answer : `'${q.answer}'`;
          feedbackEl.innerHTML = `<span style='color: #dc2626;'>아쉬워요! ❌ (정답: ${correctHint})</span>`;
        }

        // 기존 입력 요소 비활성화
        const inputs = answerAreaEl.querySelectorAll('button, input');
        inputs.forEach(el => el.disabled = true);

        // 다음 문제 진행 버튼 생성
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn'; 
        nextBtn.textContent = (current === questions.length - 1) ? '결과 확인하기 🏆' : '다음 문제 ▶';
        nextBtn.style.backgroundColor = '#0284c7';
        nextBtn.style.color = '#ffffff';
        nextBtn.style.marginTop = '18px';
        nextBtn.style.padding = '12px 28px';
        
        nextBtn.addEventListener('click', () => {
          if (current === questions.length - 1) {
            showResult();
          } else {
            current++;
            showQuestion();
          }
        });
        
        feedbackEl.appendChild(document.createElement('br'));
        feedbackEl.appendChild(nextBtn);
        nextBtn.focus();
      }

      function showResult() {
        quizArea.style.display = 'none';
        resultEl.style.display = 'block';
        
        let praiseMsg = "작은 구름 하나에도 하나님의 약속을 믿었던 엘리야처럼, 언제나 신실하신 하나님의 약속을 굳게 붙잡는 소년반 친구가 되길 응원해요! ☁️🌧️";
        if (score === questions.length) {
          praiseMsg = "대단해요! 만점입니다! 기도의 인내와 순종을 완벽하게 이해한 소년반 최고의 믿음 박사님이에요! 👑💯";
        }

        resultEl.innerHTML = `
          <h3 style="margin-top:0; font-size:26px;">${participantName} 학생의 퀴즈 결과</h3>
          <p style="font-size:22px;">3과 총 <strong>${questions.length}</strong>문제 중<br>
          <span style="color:#0284c7; font-size:46px; font-weight:900;">${score}</span> 문제를 맞혔어요!</p>
          <p style="color:#475569; font-size:18px; line-height:1.6;">${praiseMsg}</p>
          <button onclick="location.reload()" style="background-color:#0284c7; color:#fff; margin-top:16px;">다시 도전하기 🔄</button>
        `;
      }

      // 문자열 정규화 (띄어쓰기, 특수문자 제거)
      function normalize(str) {
        if (!str) return '';
        return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
      }

    });
  </script>
</body>
</html>
