<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유년반 교과 퀴즈 (6과)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');
    
    /* 전체 화면 스타일 */
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
      background: #eef7ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-size: 24px; 
    }

    /* 퀴즈 박스 스타일 */
    #quiz-container { 
      width: 90%; 
      max-width: 600px; 
      text-align: center; 
      padding: 10px 0; 
      padding-bottom: 60px; 
    }

    .question-box, .input-box { 
      padding: 30px; 
      border-radius: 15px; 
      color: #fff; 
      background-color: #4A90E2; /* 기본 배경색 */
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: background-color 0.5s; 
      line-height: 1.5;
    }

    /* 버튼 스타일 */
    button { 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 22px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: inherit; 
      background-color: #fff; 
      color: #333; 
      font-weight: bold;
      box-shadow: 0 3px 0 #ccc;
    }
    button:active { transform: translateY(3px); box-shadow: none; }
    button:hover { background-color: #f9f9f9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 입력창 스타일 */
    input[type="text"] { 
      padding: 12px; 
      font-size: 24px; 
      border-radius: 10px; 
      border: 2px solid #ddd; 
      width: 70%; 
      font-family: inherit; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* 결과 및 피드백 */
    #result { 
      font-size: 28px; 
      margin-top: 30px; 
      color: #333; 
      background: #fff; 
      padding: 30px; 
      border-radius: 20px; 
      border: 5px solid #FFD700;
    }
    #feedback { 
      min-height: 40px; 
      margin-top: 20px; 
      font-size: 28px; 
      font-weight: bold; 
    }

    /* 하단 푸터 */
    #footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #aaa;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="name-input-area" class="input-box">
      <h2>유년반 성경퀴즈 6과</h2>
      <p style="font-size: 20px;">성소: 하나님의 집</p>
      <p>이름을 입력하고 시작하세요!</p>
      <input type="text" id="name-input" placeholder="예: 최재희" />
      <br>
      <button id="start-btn">퀴즈 시작 ▶</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div id="question-number" style="font-size: 20px; color: #555; margin-bottom: 10px;"></div>
      <div id="question-text" class="question-box"></div>
      <div id="answer-area" style="margin-top: 20px;"></div>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

  <div id="footer">Distributed by Dr. Choi | 유년반 교과 6과</div>

  <script>
    'use strict';

    // 6과 문제 데이터 (하나님의 집)
    const questions = [
      { 
        type: 'ox',   
        question: '하나님께서는 이스라엘 백성들이 억지로, 그리고 아주 많이 헌금을 내야만 기뻐하신다.', 
        answer: 'X',
        comment: '하나님은 기쁜 마음으로 드리는 선물을 가장 중요하게 생각하세요! [cite: 19]'
      }, 
      { 
        type: 'fill', 
        question: '기억절: "내가 그들 중에 거할 (   )를 그들이 나를 위하여 만들되" (출애굽기 25:8)', 
        answer: '성소',
        comment: '성소는 하나님이 우리와 함께 사시는 특별한 집이에요! [cite: 46]'
      },
      { 
        type: 'mcq',  
        question: '하나님의 집인 성소를 지을 때 사용한 나무는 무엇인가요? 이 나무는 매우 튼튼하고 오래 간답니다.', 
        options: ['A. 사과나무', 'B. 조각목(아카시아 나무)', 'C. 소나무', 'D. 포도나무'], 
        answer: 'B. 조각목(아카시아 나무)',
        comment: '아카시아 나무(조각목)는 단단해서 사막의 더위와 추위에도 잘 견뎌요! '
      },
      { 
        type: 'mcq',  
        question: '하나님께서는 성소의 등불을 켤 때 무엇을 사용하라고 하셨나요?', 
        options: ['A. 촛불', 'B. 전등', 'C. 감람유(올리브 기름)', 'D. 포도즙'], 
        answer: 'C. 감람유(올리브 기름)',
        comment: '성소의 불을 밝히기 위해 특별한 올리브 기름을 사용했어요! '
      },
      { 
        type: 'short',
        question: '성소 벽을 만들 때 사용한 천의 색깔 중에서 파란색과 보라색 말고 또 어떤 색깔이 있었나요? (3글자)', 
        answer: '빨간색', // 또는 '빨간색'이나 '홍색'으로 보정 가능하나 교과 텍스트상 'scarlat(진홍색/실과색)' 의미
        answer_alt: '진홍색',
        comment: '청색, 자색, 홍색(빨간색, 진홍색) 실로 아름다운 천을 만들었어요! '
      }
    ];

    let current = 0;
    let score = 0;
    let participantName = '';
    const themes = ['#FF6F61', '#6B5B95', '#88B04B', '#4A90E2', '#FEA47F'];

    const nameInputArea = document.getElementById('name-input-area');
    const nameInput = document.getElementById('name-input');
    const startBtn = document.getElementById('start-btn');
    const quizArea = document.getElementById('quiz-area');
    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const answerAreaEl = document.getElementById('answer-area');
    const feedbackEl = document.getElementById('feedback');
    const resultEl = document.getElementById('result');

    startBtn.addEventListener('click', startGame);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

    function startGame() {
      const nameVal = nameInput.value.trim();
      if (!nameVal) { alert("이름을 입력해주세요!"); return; }
      participantName = nameVal;
      nameInputArea.style.display = 'none';
      quizArea.style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      feedbackEl.textContent = '';
      const q = questions[current];
      questionNumberEl.textContent = `문제 ${current + 1} / ${questions.length}`;
      questionTextEl.textContent = q.question;
      questionTextEl.style.backgroundColor = themes[current % themes.length];
      answerAreaEl.innerHTML = '';

      if (q.type === 'ox') {
        createBtn('O'); createBtn('X');
      } else if (q.type === 'mcq') {
        q.options.forEach(opt => createBtn(opt));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '여기에 정답을 써요';
        answerAreaEl.appendChild(input);
        const submitBtn = document.createElement('button');
        submitBtn.textContent = '확인하기';
        submitBtn.onclick = () => checkAnswer(input.value);
        answerAreaEl.appendChild(submitBtn);
        input.focus();
        input.onkeydown = (e) => { if(e.key === 'Enter') checkAnswer(input.value); };
      }
    }

    function createBtn(text) {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.onclick = () => checkAnswer(text);
      answerAreaEl.appendChild(btn);
    }

    function checkAnswer(userAns) {
      if(answerAreaEl.querySelector('.next-btn')) return;
      const q = questions[current];
      let isCorrect = false;

      if (q.type === 'mcq') {
        isCorrect = (userAns === q.answer);
      } else if (q.type === 'short') {
        const normalized = normalize(userAns);
        isCorrect = (normalized === normalize(q.answer) || normalized === normalize(q.answer_alt));
      } else {
        isCorrect = normalize(userAns) === normalize(q.answer);
      }

      if (isCorrect) {
        feedbackEl.innerHTML = "<span style='color:blue;'>정답이에요! 참 잘했어요! ⭕</span>";
        score++;
      } else {
        feedbackEl.innerHTML = `<span style='color:red;'>아쉬워요! 정답은 [${q.answer}] 예요. ❌</span>`;
      }
      
      const commentDiv = document.createElement('div');
      commentDiv.style.fontSize = '18px';
      commentDiv.style.color = '#666';
      commentDiv.style.marginTop = '10px';
      commentDiv.textContent = q.comment;
      feedbackEl.appendChild(commentDiv);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      nextBtn.textContent = (current === questions.length - 1) ? '결과 보러 가기' : '다음 문제로 ▶';
      nextBtn.style.backgroundColor = '#333';
      nextBtn.style.color = '#fff';
      nextBtn.style.marginTop = '20px';
      nextBtn.onclick = () => {
        if (current === questions.length - 1) showResult();
        else { current++; showQuestion(); }
      };
      feedbackEl.appendChild(document.createElement('br'));
      feedbackEl.appendChild(nextBtn);
    }

    function showResult() {
      quizArea.style.display = 'none';
      resultEl.style.display = 'block';
      let message = score === questions.length ? "와! 성경 박사님이시네요!" : "정말 잘했어요! 다음에도 같이 풀어요!";
      resultEl.innerHTML = `
        <h2>축하합니다, ${participantName} 어린이!</h2>
        <div style="font-size: 60px; margin: 20px 0;">🌟</div>
        <p>우리 어린이의 점수는...</p>
        <p><span style="color:#4A90E2; font-size:45px;">${score} / ${questions.length}</span></p>
        <p style="font-weight:bold;">${message}</p>
        <button onclick="location.reload()">다시 하기</button>
      `;
    }

    function normalize(str) {
      if (!str) return '';
      return str.replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    }
  </script>
</body>
</html>
